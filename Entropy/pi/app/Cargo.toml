[package]
name = "keepcrypt-pi"
description = "KeepCrypt Raspberry Pi firmware: screens, buttons, QR, USB export and snapshot import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the crates named in docs/build-plan.md. Adding one needs owner approval and a cargo-vet entry.
# No [dev-dependencies] table: scripts/canaries.sh appends one to a copy of this file, so tests
# that read vectors live in pi/sim.
[dependencies]
keepcrypt-core.workspace = true
# Fonts, shapes and the DrawTarget that the app's frame implements (tasks/todo.md, M3 Q28 (a)). It
# has no default features, so defmt, fixed_point and nalgebra_support stay off. autocfg (num-traits'
# build dependency, through float-cmp) is held at 1.5.0 by `cargo update --precise`: the imported
# cargo-vet audits cover 1.5.0, not 1.5.1.
embedded-graphics = "0.8.2"
# QR codes encoded into buffers the app owns and wipes after drawing, since the registration and
# collision-report QRs carry seal codes (Q28 (b)). The caret spec excludes the yanked 1.8.0.
qrcodegen-no-heap = "1.8.1"
# Wipes the entry-grid buffers, the frame and the QR buffers (rule 5); core's spec.
zeroize = { version = "1.9.0", features = ["derive"] }
# SHA-256 of the root filesystem, for the prefix on the boot screen and in About (tasks/todo.md,
# M4 group 9; Q39 (g)). Core's version and pi/sim's spec; core's zeroize feature unifies in anyway.
sha2 = "0.11.0"

# Linux only: the device module's glue in the keepcrypt-pi binary calls these, never the library
# pi/sim links (tasks/todo.md, M4 Q36 (a), (e)). KeepCrypt's own code has no unsafe code; the
# unsafe code the hardware access needs stays inside these crates, libc and std (Q36 (d)).
# deny.toml's [[bans.features]] pins both crates' features exactly.
[target.'cfg(target_os = "linux")'.dependencies]
# GPIO pull-ups and both-edge key events with the kernel's CLOCK_MONOTONIC timestamps, the panel's
# DC, RST and backlight outputs, and spidev SPI (build-plan.md:76). Its author archived it on
# 2025-07-01 and 0.22.1 is its last release, hence the exact pin (Q36 (b)). No features, so
# embedded-hal and hal stay off.
rppal = { version = "=0.22.1", default-features = false }
# Safe mlockall, mount and umount2, clock_gettime(CLOCK_MONOTONIC) and the non-blocking hwrng open
# (Q36 (a)); mount turns on uio. bitflags, for its flag types, is held at 2.11.1 by
# `cargo update --precise`: the imported cargo-vet audits cover 2.11.1, not 2.13.2. cfg_aliases is
# its build dependency.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "mman", "mount", "time"] }

[lints.rust]
# scripts/canaries.sh pins this table and [lints.clippy] below exactly, per crate.
# A bare `fallible();` statement drops the error (rule 3). rustc only warns about it, and any
# #[allow] or #[expect] would switch that off; forbid makes both fail with E0453.
unused_must_use = "forbid"

[lints.clippy]
# Keep this block identical in core, ffi, ffi/guard, ffi/jni and pi/app (pi/sim is a desktop dev
# tool).
# Fail closed (rule 3): the clippy.toml ban cannot be switched off in code; #[allow], #[expect]
# and #![allow(clippy::all)] fail with E0453. An exception is a reviewed change to this line.
disallowed_methods = "forbid"
# `let _ = fallible()` drops the error (rule 3); forbid, so no #[expect] can excuse it.
let_underscore_must_use = "forbid"
# Any other lint exception is an #[expect(.., reason = "..")] that review sees.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Secrets are never printed or logged (rule 5); forbid, so no #[expect] can excuse it.
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
# keepcrypt-jni holds the workspace's only unsafe code (tasks/todo.md, M5 group 7): every unsafe
# block holds one operation and a SAFETY: comment. Nothing to check where unsafe_code is forbidden.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
