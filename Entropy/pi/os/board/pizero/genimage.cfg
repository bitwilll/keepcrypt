# The KeepCrypt SD card image (tasks/todo.md, M4 group 13; Q43 (b)): an MBR with a fixed disk
# signature, partition 1 the FAT boot files listed exactly, partition 2 the SquashFS root that the
# boot hash covers. Paths are relative to Buildroot's images directory. This name is the same for
# every screen type; pi/os/Makefile's make image renames the image keepcrypt-pi-0.0.0-<name>.img,
# for the PANEL=<name> it was built with (M4b B3).

image boot.vfat {
	vfat {
		# Fixed volume ID and dates, so equal inputs give an equal partition.
		extraargs = "--invariant"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"zImage",
			"bcm2708-rpi-zero.dtb"
		}
	}

	size = 32M
}

image keepcrypt-pi.img {
	hdimage {
		disk-signature = "0x4b435049"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
}
