[[exemptions.rppal]]
version = "0.22.1"
criteria = "safe-to-deploy"
notes = "The Pi's GPIO and SPI (tasks/todo.md, M4 Q36 (a), (b)), Linux only. Archived by its author on 2025-07-01; 0.22.1 (2024-12-11) is the last release. Reviewed for M4 commit 5: the .crate matches the lock's checksum; libc is its only normal dependency and no feature is on (deny.toml pins that); the modules the firmware calls print nothing, spawn threads only for async interrupts and software PWM, which the firmware does not use, never set the REALTIME event clock flag, and fall back from /dev/gpiomem to /dev/mem, which the image's CONFIG_DEVMEM=n closes. The review note with their unsafe sites is under tasks/todo.md, M4 New dependencies. No audit on record."

