[package]
name = "keepcrypt-guard"
description = "The phone FFI's one panic catch: runs the safe layer and turns a panic into a halt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The safe layer it runs (tasks/todo.md, M5 re-plan, Q66 (a)), whose re-export of zeroize's
# Zeroizing names guarded's wiping buffers; no crates.io crate (tasks/todo.md, M5 "New
# dependencies"). Adding one needs owner approval and a cargo-vet entry.
[dependencies]
keepcrypt-ffi.workspace = true

[lints.rust]
# scripts/canaries.sh pins this table and [lints.clippy] below exactly, per crate.
# Also covers the guard's tests; the `#![forbid(unsafe_code)]` in lib.rs is what the plan requires
# (the one catch_unwind sits in a crate with no unsafe code).
unsafe_code = "forbid"
# A bare `fallible();` statement drops the error (rule 3). rustc only warns about it, and any
# #[allow] or #[expect] would switch that off; forbid makes both fail with E0453.
unused_must_use = "forbid"

[lints.clippy]
# Keep this block identical in core, ffi, ffi/guard, ffi/jni and pi/app (pi/sim is a desktop dev
# tool).
# Fail closed (rule 3): the clippy.toml ban cannot be switched off in code; #[allow], #[expect]
# and #![allow(clippy::all)] fail with E0453. An exception is a reviewed change to this line.
disallowed_methods = "forbid"
# `let _ = fallible()` drops the error (rule 3); forbid, so no #[expect] can excuse it.
let_underscore_must_use = "forbid"
# Any other lint exception is an #[expect(.., reason = "..")] that review sees.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Secrets are never printed or logged (rule 5); forbid, so no #[expect] can excuse it.
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
# keepcrypt-jni holds the workspace's only unsafe code (tasks/todo.md, M5 group 7): every unsafe
# block holds one operation and a SAFETY: comment. Nothing to check where unsafe_code is forbidden.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
