[package]
name = "keepcrypt-capi"
description = "The iPhone C ABI boundary, libkeepcrypt_capi.a: beside keepcrypt-jni, the only unsafe code in the workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# libkeepcrypt_capi.a (docs/build-plan.md, the iOS row; Q87), which the iPhone app links; the rlib
# lets this crate's integration tests call its two exports by Rust path. The name differs from
# keepcrypt-jni's `keepcrypt`, so no output names collide.
name = "keepcrypt_capi"
crate-type = ["staticlib", "rlib"]

# Exactly this one, no keepcrypt-ffi or keepcrypt-core edge, so the boundary reaches the safe layer
# only through keepcrypt_guard::guarded (tasks/todo.md, M6 item B1, as keepcrypt-jni's M5-35);
# scripts/canaries.sh pins every direct dependency. Adding one needs owner approval and a cargo-vet
# entry.
[dependencies]
keepcrypt-guard.workspace = true

[lints.rust]
# scripts/canaries.sh pins this table and [lints.clippy] below exactly, per crate.
# A bare `fallible();` statement drops the error (rule 3). rustc only warns about it, and any
# #[allow] or #[expect] would switch that off; forbid makes both fail with E0453.
unused_must_use = "forbid"

[lints.clippy]
# Keep this block identical in core, ffi, ffi/guard, ffi/jni, ffi/capi and pi/app (pi/sim is a
# desktop dev tool).
# Fail closed (rule 3): the clippy.toml ban cannot be switched off in code; #[allow], #[expect]
# and #![allow(clippy::all)] fail with E0453. An exception is a reviewed change to this line.
disallowed_methods = "forbid"
# `let _ = fallible()` drops the error (rule 3); forbid, so no #[expect] can excuse it.
let_underscore_must_use = "forbid"
# Any other lint exception is an #[expect(.., reason = "..")] that review sees.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Secrets are never printed or logged (rule 5); forbid, so no #[expect] can excuse it.
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
# keepcrypt-jni and keepcrypt-capi hold the workspace's only unsafe code (tasks/todo.md, M5 group
# 7; M6 item B4): every unsafe block holds one operation and a SAFETY: comment. Nothing to check
# where unsafe_code is forbidden.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
