permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks
          path: ${{ runner.temp }}/apks/
  legs:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # upload-artifact's approved SHA, another action's name
        with:
          name: apks
