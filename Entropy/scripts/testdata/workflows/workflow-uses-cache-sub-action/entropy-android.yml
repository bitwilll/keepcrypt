permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apks/
          key: apks-${{ github.run_id }}-${{ github.run_attempt }}
  legs:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # a sub-action at the approved commit
        with:
          path: ${{ runner.temp }}/apks/
          key: apks-${{ github.run_id }}-${{ github.run_attempt }}
