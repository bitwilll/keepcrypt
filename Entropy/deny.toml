# cargo-deny 0.20 policy for the device workspace (core, ffi, ffi/guard, ffi/jni, pi/app, pi/sim).
# Run: cargo deny --locked check. scripts/canaries.sh proves on every CI run that the bans fire
# for a normal, dev-only, target-only and feature-gated dependency (rand family, network, logging),
# and for rand added to the real keepcrypt-core; that a git dependency fails [sources]; and that
# a nix feature beyond [[bans.features]]'s list fails. It also pins [graph], the [bans] deny list,
# [[bans.features]] and [sources] to exactly the values below, so any edit to them (an exclude, a
# removed ban, a widened feature list, an allowed git source) fails until canaries.sh changes too.
# Weakening any entry below needs owner review (CODEOWNERS covers this file).

[graph]
# No `targets` filter: cargo-deny then checks every dependency whatever its cfg, so a banned crate
# under [target.'cfg(windows)'.dependencies] (say, in pi/sim) is still seen.
# all-features: a banned crate behind an optional feature (say, test-sources = ["dep:rand_core"])
# is still seen; CI runs with default features only.
all-features = true
# Dev-dependencies stay in the graph (exclude-dev = false is the default).

[advisories]
# 0.20 mapping of the M0 plan:
#   vulnerabilities  always an error (the 0.20 schema has no switch for them)
#   unsound          "all": an error for any crate in the graph
#   yanked           "deny"
#   unmaintained     0.20 can only error ("all"/"workspace"/"transitive") or skip ("none");
#                    it has no warn level. "none" here, and `cargo audit` (same CI job) prints
#                    unmaintained advisories as warnings without failing, which is the plan's "warn".
unsound = "all"
yanked = "deny"
unmaintained = "none"
# No ignores. Any ignore needs owner approval and a reason.
ignore = []

[licenses]
# Exactly the licences the current graph needs; an unused allowance fails the check.
# Finalised against the owner's dual MIT OR Apache-2.0 choice for KeepCrypt itself.
#   MIT, Apache-2.0  most crates, and KeepCrypt's own dual licence
#   CC0-1.0          rust-bitcoin crates (bitcoin, bip39, miniscript, secp256k1, ...)
#   MITNFA           hex_lit (bitcoin dependency)
#   Unicode-3.0      unicode-ident (proc-macro dependency)
#   BSD-3-Clause     ed25519-dalek, curve25519-dalek and subtle (Ed25519 verification of registry
#                    snapshots and proofs; owner-approved with tasks/todo.md, M1 Q3 (i))
# With no target filter the graph also holds r-efi (getrandom's UEFI backend), licensed
# MIT OR Apache-2.0 OR LGPL-2.1-or-later; MIT covers it, so no allowance changed.
allow = ["MIT", "Apache-2.0", "CC0-1.0", "MITNFA", "Unicode-3.0", "BSD-3-Clause"]
unused-allowed-license = "deny"
exceptions = []
# Dev-dependencies too. Our own unpublished crates are checked as well (licenses.private default).
include-dev = true

[bans]
multiple-versions = "warn"
# Path-only workspace deps are fine because every member has publish = false.
wildcards = "deny"
allow-wildcard-paths = true
# No wrappers and no exceptions: a banned crate anywhere in the graph fails the check. Each entry
# stays a bare crate name (an inline table could carry wrappers; name@version bans only some).
deny = [
    # Rule 1: only core/src/source calls getrandom; no other RNG.
    "rand",
    "rand_core",
    "rand_chacha",
    "rand_xoshiro",
    "rand_xorshift",
    "rand_pcg",
    "rand_hc",
    "rand_isaac",
    "fastrand",
    "oorandom",
    "nanorand",
    "tinyrand",
    "turborand",
    # Device code never touches the network (registry/server is a separate workspace).
    "tokio",
    "mio",
    "hyper",
    "h2",
    "reqwest",
    "ureq",
    "curl",
    "isahc",
    "axum",
    "async-std",
    # Rule 5: no logging in device code.
    "log",
    "tracing",
    "slog",
    "env_logger",
]

# The Pi hardware crates and jni-sys resolve with exactly these features in every build
# (tasks/todo.md, M4 group 2; Q36 (a); M5 group 7). all-features = true above reaches only our own
# crates' features, so these entries are what keep a dependency's optional features off, whichever
# manifest asks for one.
[[bans.features]]
# rppal is archived: its author archived the repository on 2025-07-01, so 0.22.1 is its last
# release (Q36 (b)). No features, so embedded-hal, hal and the rest stay off.
crate = "rppal"
exact = true
allow = []

[[bans.features]]
# nix: memory locking, mounting the stick, the monotonic clock and the hwrng's open flags; mount
# turns on uio. net, socket and every other feature stay off.
crate = "nix"
exact = true
allow = ["fs", "mman", "mount", "time", "uio"]

[[bans.features]]
# jni-sys, keepcrypt-jni's declarations of jni.h (tasks/todo.md, M5 group 7; Q53): 0.3.0 has no
# features, and none may appear.
crate = "jni-sys"
exact = true
allow = []

[sources]
# crates.io only. Coldcard's weak-entropy bug came in through a git submodule.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
