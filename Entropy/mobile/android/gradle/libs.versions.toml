# Every Gradle plugin and library of M5, at exact versions (tasks/todo.md, M5 "New dependencies";
# Q54). All of them are declared from the first Gradle commit on, so the lockfiles and the
# verification metadata are written once (group 4). M5 expects no later dependency change: one
# stops the work and the lead re-plans, since regenerating the pins needs a reviewed, temporary
# exception to the gate's bootstrap rule (lead decision M5-13). Each was published at least 14
# days before it was pinned here (2026-10-17).
#
# The one such exception (2026-10-20, Q67; the Compose Multiplatform re-plan, "Dependency
# bootstrap"; the re-cut after Q73): the owner's Q64 added the shared screens, so commit 8q declares
# the two Kotlin Multiplatform plugins, Compose Multiplatform's runtime, foundation and ui and
# kotlin-test below. The owner's Q73 then dropped the iPhone target from M5, so the shared modules
# declare the Android target only (lead decision M5-31), and no iPhone library or toolchain. The
# Android workflow regenerates the lockfiles and the verification metadata once more, under the
# gate's kt_bootstrap_exception (commit 8w); commit 8x commits that run's files, turns the
# exception off and puts M5-13's stop back, and their review against Google's Maven and Maven
# Central, which pins the new signers, needs a fetch of its own (a later commit). kotlin-test brings
# kotlin-test-junit 2.4.20 on the JVM.
# These were published by 2026-09-22, before the 14-day cutoff of 2026-10-06.

[versions]
# The Android Gradle plugin 9.3.3 (2026-09-17), com.android.application, com.android.library and
# com.android.kotlin.multiplatform.library.
agp = "9.3.3"
# Kotlin 2.4.20 (2026-09-07): the Compose compiler plugin and the Kotlin Gradle plugin that the
# Android Gradle plugin's built-in Kotlin compiles with; the Kotlin Multiplatform plugin of
# :core-ffi and :screens, and kotlin-test (tests only).
kotlin = "2.4.20"
# Compose Multiplatform 1.12.1 (2026-09-22; Q67, lead decision M5-24): runtime, foundation and ui,
# by their coordinates, in :screens. On Android they stand for the Jetpack Compose 1.12.1 below.
compose-multiplatform = "1.12.1"
# In the app.
activity-compose = "1.13.0"
compose-bom = "2026.09.00"
compose-foundation = "1.12.1"
zxing = "3.5.4"
# Tests only (androidx.test runner and core share a version).
test-runner = "1.7.0"
test-ext-junit = "1.3.0"
test-uiautomator = "2.4.0"
junit = "4.13.2"
# The Android SDK and NDK the modules build with (read by every module's build file).
android-compile-sdk = "37"
android-target-sdk = "36"
android-min-sdk = "31"
android-build-tools = "36.0.0"
android-ndk = "30.0.16248370"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-foundation" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "test-uiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# The shared modules (Q67): Kotlin Multiplatform, with the Android Gradle plugin's own plugin for a
# Kotlin Multiplatform library's Android target (com.android.kotlin.multiplatform.library, 9.3.3).
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
