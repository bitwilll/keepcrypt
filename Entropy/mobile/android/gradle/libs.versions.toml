# Every Gradle plugin and library of M5, at exact versions (tasks/todo.md, M5 "New dependencies";
# Q54). All of them are declared from the first Gradle commit on, so the lockfiles and the
# verification metadata are written once (group 4); a new one is a reviewed change with its own
# two-commit bootstrap. Each was published at least 14 days before it was pinned here (2026-10-17).

[versions]
# The Android Gradle plugin 9.3.3 (2026-09-17), com.android.application and com.android.library.
agp = "9.3.3"
# Kotlin 2.4.20 (2026-09-07): the Compose compiler plugin and the Kotlin Gradle plugin that the
# Android Gradle plugin's built-in Kotlin compiles with.
kotlin = "2.4.20"
# In the app.
activity-compose = "1.13.0"
compose-bom = "2026.09.00"
compose-foundation = "1.12.1"
zxing = "3.5.4"
# Tests only (androidx.test runner and core share a version).
test-runner = "1.7.0"
test-ext-junit = "1.3.0"
test-uiautomator = "2.4.0"
junit = "4.13.2"
# The Android SDK and NDK the modules build with (read by every module's build file).
android-compile-sdk = "37"
android-target-sdk = "36"
android-min-sdk = "31"
android-build-tools = "36.0.0"
android-ndk = "30.0.16248370"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-foundation" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "test-uiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
