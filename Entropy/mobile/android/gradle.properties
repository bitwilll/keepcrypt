# Gradle and Android Gradle plugin settings for every module (tasks/todo.md, M5 group 4).
# Nothing is fetched behind the build's back: no JDK download (CI runs Gradle on the runner's JDK
# 17, named in JAVA_HOME) and no Android SDK download (a missing platform, build-tools or NDK
# fails the build instead of being installed). No build scan is ever made:
# scripts/android-gradle.sh runs every build with --no-scan.
org.gradle.java.installations.auto-download=false
android.builder.sdkDownload=false
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Kotlin/Native's data directory (lead decision M5-28): .konan/ inside this project, git-ignored,
# emptied at the start of every CI run and never cached. The compiler and its toolchain land there,
# never in the home directory; scripts/android-gradle.sh runs Gradle from this directory, so the
# relative path means this project's whichever way it is read. The three toolchain archives come
# from scripts/konan-deps.sh, checked against the Kotlin Release key, into its cache/ subdirectory.
konan.data.dir=.konan
