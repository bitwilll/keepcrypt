[package]
name = "keepcrypt-core"
description = "KeepCrypt core: all entropy, seed, seal, braille and backup work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the crates named in docs/build-plan.md. Adding one needs owner approval and a cargo-vet entry.
[dependencies]
getrandom = "0.4.3"
sha2 = { version = "0.11.0", features = ["zeroize"] }
# HMAC-SHA256 for the seal code (tasks/todo.md, M1 group 7; Q1, table A), and later the age header
# MAC and HKDF. zeroize wipes the keyed state on drop; ctutils is held at 0.4.2 by
# `cargo update --precise` (0.4.3 is inside the 14-day cool-off).
hmac = { version = "0.13.0", default-features = false, features = ["zeroize"] }
# alloc, not std: bip39's std turns on serde and `impl Serialize for Mnemonic` (rule 5).
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
bitcoin = { version = "0.32.102", default-features = false, features = ["std"] }
miniscript = { version = "13.1.0", default-features = false }
# NFKD of the BIP39 passphrase into a zeroizing buffer (tasks/todo.md, M1 Q5). Already in the
# lockfile through bip39, with the same features; a new direct edge, named in docs/build-plan.md.
unicode-normalization = { version = "0.1.25", default-features = false }
zeroize = { version = "1.9.0", features = ["derive"] }
secrecy = "0.10.3"
thiserror = "2.0.21"

# Test-only crates (tasks/todo.md, M1 Q4), never in the device build: trybuild runs the
# compile-fail typestate and secret-type fixtures (rule 6); serde_json lets tests read
# vectors/*.json as serde_json::Value. Exact pins: trybuild 1.0.122 is inside the 14-day cool-off.
# serde stays out of core's normal and build graph; a canary pins that in M1 group 12.
[dev-dependencies]
trybuild = "=1.0.121"
serde_json = "=1.0.151"

# Test-only features, both off by default (CLAUDE.md rule 10). No manifest turns either one on, in
# any dependency table (normal, dev, build or target-specific) or feature: cargo merges features
# across every package in one build, so one such entry anywhere would put stubs or the test key
# into every binary a --workspace build links. They are switched on only from the command line,
# one package at a time: `cargo test -p keepcrypt-core --features test-sources`, or
# `-p <crate> --features keepcrypt-core/test-registry` for a crate that depends on core (the M3
# simulator, the M5/M6 gate builds). scripts/canaries.sh pins this table and enforces the rule.
# - test-registry: pins the test registry public key, with the marker KC_TEST_REGISTRY_DO_NOT_SHIP.
# - test-sources: the stub entropy sources, with the marker KC_TEST_SOURCE_DO_NOT_SHIP. It turns
#   on test-registry, never the reverse, so a build that trusts the local test registry (the M3
#   simulator, the M5/M6 gate builds) links no stub.
[features]
default = []
test-registry = []
test-sources = ["test-registry"]

[lints.rust]
# scripts/canaries.sh pins this table and [lints.clippy] below exactly, per crate.
# Also covers core's tests and examples; the `#![forbid(unsafe_code)]` in lib.rs is what the docs require.
unsafe_code = "forbid"
# A bare `fallible();` statement drops the error (rule 3). rustc only warns about it, and any
# #[allow] or #[expect] would switch that off; forbid makes both fail with E0453.
unused_must_use = "forbid"

[lints.clippy]
# Keep this block identical in core, ffi and pi/app (pi/sim is a desktop dev tool).
# Fail closed (rule 3): the clippy.toml ban cannot be switched off in code; #[allow], #[expect]
# and #![allow(clippy::all)] fail with E0453. An exception is a reviewed change to this line.
disallowed_methods = "forbid"
# `let _ = fallible()` drops the error (rule 3); forbid, so no #[expect] can excuse it.
let_underscore_must_use = "forbid"
# Any other lint exception is an #[expect(.., reason = "..")] that review sees.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Secrets are never printed or logged (rule 5); forbid, so no #[expect] can excuse it.
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
