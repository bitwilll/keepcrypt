[package]
name = "keepcrypt-core"
description = "KeepCrypt core: all entropy, seed, seal, braille and backup work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the crates named in docs/build-plan.md. Adding one needs owner approval and a cargo-vet entry.
[dependencies]
getrandom = "0.4.3"
sha2 = { version = "0.11.0", features = ["zeroize"] }
# alloc, not std: bip39's std turns on serde and `impl Serialize for Mnemonic` (rule 5).
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
bitcoin = { version = "0.32.102", default-features = false, features = ["std"] }
miniscript = { version = "13.1.0", default-features = false }
zeroize = { version = "1.9.0", features = ["derive"] }
secrecy = "0.10.3"
thiserror = "2.0.21"
# NEGATIVE TEST, never merge: cargo-deny must reject this (rule 1).
rand = { version = "=0.8.5", default-features = false }

[lints.rust]
# scripts/canaries.sh pins this table and [lints.clippy] below exactly, per crate.
# Also covers core's tests and examples; the `#![forbid(unsafe_code)]` in lib.rs is what the docs require.
unsafe_code = "forbid"
# A bare `fallible();` statement drops the error (rule 3). rustc only warns about it, and any
# #[allow] or #[expect] would switch that off; forbid makes both fail with E0453.
unused_must_use = "forbid"

[lints.clippy]
# Keep this block identical in core, ffi and pi/app (pi/sim is a desktop dev tool).
# Fail closed (rule 3): the clippy.toml ban cannot be switched off in code; #[allow], #[expect]
# and #![allow(clippy::all)] fail with E0453. An exception is a reviewed change to this line.
disallowed_methods = "forbid"
# `let _ = fallible()` drops the error (rule 3); forbid, so no #[expect] can excuse it.
let_underscore_must_use = "forbid"
# Any other lint exception is an #[expect(.., reason = "..")] that review sees.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Secrets are never printed or logged (rule 5); forbid, so no #[expect] can excuse it.
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
