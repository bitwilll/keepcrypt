# KeepCrypt-Entropy iOS (Entropy/tasks/todo.md, M5 re-plan for Compose Multiplatform, "CI for the
# iPhone target"; Q65, Q67-Q69): the iPhone target of the two shared Kotlin Multiplatform modules
# of Entropy/mobile/android, :core-ffi and :screens, built in one job on GitHub's macOS runner (free
# for this public repository). As the plan's commits land, the same job links the release framework
# and the test executables and scans what they import (commit 8s), builds and scans the iOS Rust
# library and runs the shared tests on the iOS simulator, one class per process (commit 14; lead
# decision M5-29), and checks that the library it scanned is byte for byte the one it linked.
#
# This is the skeleton (commit 8q), in bootstrap mode (Q67): under the reviewed, temporary exception
# to the gate's bootstrap rule that lead decision M5-13 reserved (banned-api-check.sh's
# kt_bootstrap_exception names this workflow's one lock-writing Gradle line), one Gradle run
# resolves every configuration of :core-ffi and :screens and compiles and links their iPhone code,
# writing their lock state and adding the SHA-256 of every file it fetches to the verification
# metadata. The files are uploaded for commit 8r, which merges them with the Android job's, reviews
# and commits them and puts the strict build back. The run prints the probe's facts as "probe:"
# lines.
#
# Kotlin/Native (Q68): the compiler, kotlin-native-prebuilt 2.4.20 for macOS arm64, comes through
# Gradle like every other artifact. Its three toolchain archives come from scripts/konan-deps.sh,
# which fetches them from download.jetbrains.com, checks each detached signature against the Kotlin
# Release key (in --bootstrap mode it prints each archive's SHA-256 for commit 8r to pin) and puts
# them in the cache of Kotlin/Native's data directory, mobile/android/.konan (lead decision M5-28),
# where the compiler's own fetcher, which checks nothing, extracts them without a download. The
# directory starts empty and is never cached; download.jetbrains.com and its CDN host are blocked
# before the first Gradle call, so any fetch the compiler tries fails the build.
#
# Toolchain: macos-26 (arm64) with Xcode 26.4.1 (17E202) at /Applications/Xcode_26.4.1.app and no
# fallback (Kotlin 2.4.20 was tested with 26.4's first build, 17E192: the difference is recorded,
# and a warning about it is never silenced); JDK 17 from the image ($JAVA_HOME_17_arm64; its default
# is 21); Gradle from scripts/android-gradle.sh (pinned SHA-256, no wrapper jar), with only Google's
# Maven and Maven Central, no JDK or SDK download, no daemon and no build scan. No Rust until
# commit 14.
#
# Not one of the 14 required checks (Q55, Q69), so path filters are safe, as in entropy-android.yml:
# a skipped run never leaves a required check pending. The rule instead (Q38 (b)): no PR that
# touches these paths merges without a green run of this workflow on its final head.
#
# Hardening, as in entropy-ci.yml, whose gates job checks this file too (banned-api-check.sh
# --workflows): read-only token and no secret; only actions/checkout, actions/cache (the Gradle
# distribution alone, never .konan) and actions/upload-artifact, pinned by commit SHA; no event
# data inside run scripts (it reaches them through env and with only). The job builds a PR's head
# commit, never GitHub's merge commit, or the pushed, scheduled or dispatched commit, and prints the
# commit it built.

name: Entropy iOS

on:
  pull_request:
    paths:
      - 'Entropy/mobile/**'
      - 'Entropy/ffi/**'
      - 'Entropy/core/**'
      - 'Entropy/scripts/android-gradle.sh'
      - 'Entropy/scripts/konan-deps.sh'
      - '.github/workflows/entropy-ios.yml'
  push:
    branches: [main]
    paths:
      - 'Entropy/mobile/**'
      - 'Entropy/ffi/**'
      - 'Entropy/core/**'
      - 'Entropy/scripts/android-gradle.sh'
      - 'Entropy/scripts/konan-deps.sh'
      - '.github/workflows/entropy-ios.yml'
  schedule:
    # Weekly (Mondays, 06:11 UTC): main still builds, from fresh downloads but for the cached
    # Gradle distribution.
    - cron: '11 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer PR run cancels the older one; any other run always finishes, as in entropy-ci.yml.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash runs with -eo pipefail: any failing command fails the step.
    shell: bash
    working-directory: Entropy

jobs:
  ios:
    name: ios (build, simulator)
    runs-on: macos-26
    # The 90-minute ceiling (tasks/todo.md, M5 "Budgets") until the first green run is measured;
    # the lead then sets the job's budget to that time plus 25%.
    timeout-minutes: 90
    env:
      # Xcode 26.4.1 (17E202), the image's build of the 26.4 that Kotlin 2.4.20 was tested with.
      # The build facts below fail if it is missing or another; nothing falls back to the image's
      # default Xcode.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The runner, the pinned Xcode and its SDKs, JDK 17 (named explicitly; nothing downloads
      # another), and what the probe asks of the image: whether gpg is there (scripts/konan-deps.sh
      # needs it; none is installed here) and whether it has an Android SDK.
      - name: Build facts (the runner, Xcode 26.4.1, JDK 17, gpg)
        run: |
          fail() { echo "FAIL: build facts: $1" >&2; exit 1; }
          echo "commit: $(git rev-parse HEAD)"
          echo "ImageOS: $ImageOS"
          echo "ImageVersion: $ImageVersion"
          sw_vers
          uname -m
          df -h
          [ -d "$DEVELOPER_DIR" ] || fail "no $DEVELOPER_DIR (Xcode 26.4.1)"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version"
          [ "$(sed -n 1p "$RUNNER_TEMP/xcode-version")" = "Xcode 26.4.1" ] || fail "DEVELOPER_DIR is not Xcode 26.4.1"
          [ "$(sed -n 2p "$RUNNER_TEMP/xcode-version")" = "Build version 17E202" ] || fail "Xcode 26.4.1 is not build 17E202"
          echo "probe: xcode: 26.4.1 (17E202) in use; Kotlin 2.4.20's konan.properties names 26.4 (17E192)"
          echo "probe: xcode: iPhone SDK $(xcrun --sdk iphoneos --show-sdk-version), simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
          [ -n "${JAVA_HOME_17_arm64:-}" ] && [ -x "$JAVA_HOME_17_arm64/bin/java" ] || fail "no JDK 17 (JAVA_HOME_17_arm64)"
          "$JAVA_HOME_17_arm64/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/java-version"
          grep -q '^openjdk version "17[.]' "$RUNNER_TEMP/java-version" || fail "JAVA_HOME_17_arm64 is not a JDK 17"
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          if command -v gpg > /dev/null; then
            echo "probe: gpg on the image: $(command -v gpg), $(gpg --version | head -n 1)"
          else
            echo "probe: gpg on the image: none"
          fi
          echo "probe: Android SDK on the image: ANDROID_HOME=${ANDROID_HOME:-unset}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
      # The Gradle distribution from the cache, keyed on the version and SHA-256 pinned in
      # scripts/android-gradle.sh, which checks the zip against that pin on every run, a restored
      # one included. Only the zip is cached, never Gradle's user home or Kotlin/Native's directory.
      - name: Gradle distribution cache key (the pin in scripts/android-gradle.sh)
        run: |
          v=$(sed -n 's/^version=\([0-9][0-9.]*\)$/\1/p' scripts/android-gradle.sh)
          h=$(sed -n 's/^sha256=\([0-9a-f]\{64\}\)$/\1/p' scripts/android-gradle.sh)
          [ -n "$v" ] && [ -n "$h" ] || { echo "FAIL: no version or SHA-256 pin in scripts/android-gradle.sh" >&2; exit 1; }
          echo "gradle-$v-bin.zip, SHA-256 $h"
          {
            echo "KC_GRADLE_ZIP=gradle-$v-bin.zip"
            echo "KC_GRADLE_KEY=gradle-$v-bin-$h"
          } >> "$GITHUB_ENV"
      - name: The Gradle distribution from the cache (keyed on its version and SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.keepcrypt-gradle/${{ env.KC_GRADLE_ZIP }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.KC_GRADLE_KEY }}
      - name: Gradle (scripts/android-gradle.sh --version)
        run: sh scripts/android-gradle.sh --dependency-verification strict --version
      # Kotlin/Native's data directory starts empty (lead decision M5-28; never cached), so no
      # restored or planted extracted tree is trusted. Then the three toolchain archives, each
      # signature-checked against the Kotlin Release key before its SHA-256 is computed, go into its
      # cache/ (Q68). The script's output, with each archive's SHA-256 for commit 8r, is kept for the
      # artifact.
      - name: Toolchain archives (scripts/konan-deps.sh --bootstrap)
        run: |
          fail() { echo "FAIL: toolchain archives: $1" >&2; exit 1; }
          rm -rf mobile/android/.konan
          [ ! -e mobile/android/.konan ] || fail "mobile/android/.konan is still there"
          if [ -e "$HOME/.konan" ]; then echo "probe: ~/.konan before the build: present"; else echo "probe: ~/.konan before the build: absent"; fi
          out=mobile/android/build/kc-bootstrap
          mkdir -p "$out"
          sh scripts/konan-deps.sh --bootstrap 2>&1 | tee "$out/konan-deps.txt"
          echo "probe: the toolchain archives' signatures and SHA-256 (from signature-checked files):"
          grep -E '^konan-deps: (sha256 |.*: signature good)' "$out/konan-deps.txt" | sed 's/^/probe:   /'
          ls -l mobile/android/.konan/cache
      # The hosts Kotlin/Native's own fetcher downloads from, download.jetbrains.com and its CDN
      # host, resolve to an unroutable address from here on (the re-plan's "Kotlin/Native toolchain
      # archives", step 3), so a fetch it tries fails the build instead of happening unseen. Gradle's
      # own repositories are not affected. A connection that still succeeds fails the step.
      - name: Kotlin/Native download hosts blocked
        run: |
          fail() { echo "FAIL: host block: $1" >&2; exit 1; }
          for h in download.jetbrains.com download-cdn.jetbrains.com; do
            printf '0.0.0.0 %s\n:: %s\n' "$h" "$h" | sudo tee -a /etc/hosts > /dev/null
          done
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || :
          tail -n 4 /etc/hosts
          for h in download.jetbrains.com download-cdn.jetbrains.com; do
            dscacheutil -q host -a name "$h" || :
            if curl --silent --show-error --max-time 20 --output /dev/null "https://$h/kotlin/native/"; then
              fail "https://$h/ still answers"
            fi
            echo "https://$h/ is blocked"
          done
      # The bootstrap build (the reviewed, temporary exception, Q67; its Gradle line is the one that
      # banned-api-check.sh's kt_bootstrap_exception names for this workflow): buildEnvironment,
      # the dependencies report of :core-ffi and :screens (every configuration of the two shared
      # modules, the iPhone ones among them), their common and iPhone metadata compilations (the
      # klib commonizer), both iPhone targets' test executables (so their main and test code
      # compiles) and the device target's release framework of :screens, in one Gradle run that
      # writes their gradle.lockfile and adds the SHA-256 of every file it fetches, the Kotlin/Native
      # compiler included, to gradle/verification-metadata.xml. Lock state is written, not checked,
      # and no checksum is checked while the metadata is written. The whole log is kept for the
      # artifact. A Gradle failure fails the step.
      - name: Bootstrap build (lockfiles and verification metadata written, Q67)
        run: |
          out=mobile/android/build/kc-bootstrap
          if ! sh scripts/android-gradle.sh --write-locks --write-verification-metadata sha256 \
            buildEnvironment :core-ffi:dependencies :screens:dependencies \
            :core-ffi:compileCommonMainKotlinMetadata :screens:compileCommonMainKotlinMetadata \
            :core-ffi:compileIosMainKotlinMetadata :screens:compileIosMainKotlinMetadata \
            :core-ffi:linkDebugTestIosArm64 :core-ffi:linkDebugTestIosSimulatorArm64 \
            :screens:linkDebugTestIosArm64 :screens:linkDebugTestIosSimulatorArm64 \
            :screens:linkReleaseFrameworkIosArm64 2>&1 | tee "$out/gradle.log"; then
            echo "FAIL: the bootstrap build failed (above)" >&2
            exit 1
          fi
      # The files commit 8r merges, reviews and commits (kept 14 days): the shared modules'
      # gradle.lockfile, the verification metadata, and the kc-bootstrap directory with the
      # bootstrap build's log and konan-deps.sh's output (the archives' SHA-256 to pin).
      - name: Upload the bootstrap files (lockfiles, verification metadata, archive hashes, log)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-bootstrap
          path: |
            Entropy/mobile/android/core-ffi/gradle.lockfile
            Entropy/mobile/android/screens/gradle.lockfile
            Entropy/mobile/android/gradle/verification-metadata.xml
            Entropy/mobile/android/build/kc-bootstrap/
          retention-days: 14
          if-no-files-found: error
      # The probe's macOS facts (the re-plan's "Unverified until the probe", 8o-8q): the verified
      # bundle's archive names, download switches and iOS minimum versions (konan.properties), what
      # the build extracted (dependencies/.extracted, which commit 8r requires to equal the pinned
      # names) and left in the cache, whether ~/.konan was touched, the Kotlin/Native lines of the
      # lockfiles, any Xcode warning in the Gradle log, the simulators the image offers (the test
      # runs' device), and each linked file's size and minimum iOS version. Listed, not judged.
      - name: Probe facts (Kotlin/Native, Xcode, the simulators, the linked files)
        run: |
          konan=mobile/android/.konan
          out=mobile/android/build/kc-bootstrap
          set -- "$konan"/kotlin-native-prebuilt-*/konan/konan.properties
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "FAIL: probe: not exactly one Kotlin/Native bundle in $konan: $*" >&2; exit 1; }
          echo "probe: the bundle: ${1#"$konan"/}"
          echo "probe: its konan.properties, the macOS arm64 lines, the download switches and the minimum versions:"
          awk '/macos_arm64|^dependenciesUrl|^airplaneMode|osVersionMin|minVersion/ { p = 1 } p { print } !/\\$/ { p = 0 }' "$1" | sed 's/^/probe:   /'
          echo "probe: $konan/dependencies/.extracted:"
          if [ -f "$konan/dependencies/.extracted" ]; then sed 's/^/probe:   /' "$konan/dependencies/.extracted"; else echo "probe:   none"; fi
          echo "probe: $konan/dependencies and $konan/cache after the build:"
          (cd "$konan" && ls -a dependencies cache 2>&1) | sed 's/^/probe:   /'
          if [ -e "$HOME/.konan" ]; then echo "probe: ~/.konan after the build: present"; else echo "probe: ~/.konan after the build: absent"; fi
          echo "probe: Kotlin/Native and the klib commonizer in the regenerated lockfiles:"
          grep -h -E 'kotlin-native-prebuilt|kotlin-klib-commonizer' mobile/android/core-ffi/gradle.lockfile \
            mobile/android/screens/gradle.lockfile | sed 's/^/probe:   /' || echo "probe:   none"
          echo "probe: Xcode in the Gradle log (a warning about 26.4.1 is recorded here, never silenced):"
          grep -n -i -e 'xcode' "$out/gradle.log" | sed 's/^/probe:   /' || echo "probe:   none"
          echo "probe: the simulators the image offers:"
          xcrun simctl list devices available | sed 's/^/probe:   /'
          echo "probe: the linked files, their size and minimum iOS version (LC_BUILD_VERSION minos):"
          for f in mobile/android/core-ffi/build/bin/*/debugTest/test.kexe mobile/android/screens/build/bin/*/debugTest/test.kexe \
            mobile/android/screens/build/bin/iosArm64/releaseFramework/KeepCryptScreens.framework/KeepCryptScreens; do
            [ -f "$f" ] || { echo "probe:   $f: none"; continue; }
            echo "probe:   $f: $(wc -c < "$f" | tr -d ' ') bytes, minos $(otool -l "$f" | awk '$1 == "minos" { print $2; exit }')"
          done
      # The probe's Android SDK question (the re-plan's "CI for the iPhone target"): do the iPhone
      # tasks need an Android SDK? One more Gradle run, strict and offline on the files the bootstrap
      # wrote, with the image's SDK hidden, configures every module and runs one iPhone task. Either
      # answer is a probe fact, so this step does not fail on it.
      - name: Probe facts (do the iPhone tasks need an Android SDK?)
        run: |
          rc=0
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT sh scripts/android-gradle.sh --dependency-verification strict --offline \
            :core-ffi:compileKotlinIosSimulatorArm64 > "$RUNNER_TEMP/no-sdk.log" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "probe: android sdk: with none, the shared modules configure and the iPhone task runs"
          else
            tail -n 40 "$RUNNER_TEMP/no-sdk.log"
            echo "probe: android sdk: with none, the Gradle run exits $rc (above)"
          fi
