# KeepCrypt-Entropy Pi image (Entropy/tasks/todo.md, M4 groups 14 and 15, M7 C1-C2; Q38): the SD card
# image built from Entropy/pi/os three times, on two fresh x86_64 runners and an arm64 one, each in a
# fresh copy of the pinned build container (Entropy/pi/os/container/Dockerfile, run through
# pi/os/container.sh; the arm64 host emulates its linux/amd64), at the same KC_WORK, and a job that
# fails unless all three gave the same image (docs/build-plan.md, "Reproducible build"). Leg a
# restores Buildroot's downloads (dl/) from the cache by exact key and leg b downloads everything
# afresh; Buildroot checks every download by its hash either way. Leg a uploads the image, kept
# 14 days, which the owner downloads signed in to GitHub; any commit can be rebuilt after that by
# hand, through workflow_dispatch's ref (once this workflow is on main).
#
# Not one of the 14 required checks (Q38 (b)), so path filters are safe: a skipped run never
# leaves a required check pending. The rule instead: no PR that changes the image merges without
# a green run of this workflow on its final head commit, recorded in tasks/todo.md's Review.
# Each leg scans the image it built against the reviewed lists in Entropy/pi/os/expected/
# (banned-api-check.sh --image, with the kernel config it was built with and the SHA-256 of the
# keepcrypt-pi cargo built); a hit fails the leg, so leg a uploads only an image that passed, and
# the compare job, which runs either way, succeeds only when both legs did.
#
# Hardening, as in entropy-ci.yml, whose gates job checks this file too (banned-api-check.sh
# --workflows): read-only token and no secret; only actions/checkout, actions/cache and
# actions/upload-artifact, pinned by commit SHA; no event data inside run scripts (it reaches them
# through env and with only). Every job builds a PR's head commit, never GitHub's merge commit,
# or a dispatch's ref, or the pushed or scheduled commit, and prints the commit it built.
#
# The three legs share one list of steps (a YAML anchor), so they cannot drift apart; the job-level
# LEG says which leg runs, and only the emulation, cache, release-file and upload steps read it.

name: Entropy Pi image

on:
  pull_request:
    paths:
      - 'Entropy/**'
      - '.github/workflows/entropy-pi-image.yml'
  push:
    branches: [main]
    # A release tag (Entropy/tasks/todo.md, M7 B3, Q110): GitHub applies no path filter to a tag push.
    tags: ['v*']
    paths:
      - 'Entropy/**'
      - '.github/workflows/entropy-pi-image.yml'
  schedule:
    # Weekly (Mondays, 04:17 UTC): main still builds the same image, from fresh downloads in leg b.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'The commit, branch or tag to build (empty: the branch the run starts from)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One group per event and ref (for a dispatch, also the requested ref). A newer PR run cancels
  # the older one; any other run is never cancelled, as in entropy-ci.yml, so main's push run,
  # which gives the gate's after-merge hash, always finishes, and only a newer push to main can
  # replace it while it waits (GitHub keeps one queued run per group).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash runs with -eo pipefail: any failing command fails the step.
    shell: bash

env:
  # The build directory, the same path in every build (pi/os/Makefile).
  KC_WORK: /kc-work

jobs:
  build-a:
    name: pi-image build (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEG: a
    defaults: &leg-defaults
      run:
        shell: bash
        working-directory: Entropy
    outputs: &leg-outputs
      commit: ${{ steps.hash.outputs.commit }}
      name: ${{ steps.hash.outputs.name }}
      image: ${{ steps.hash.outputs.image }}
      partition1: ${{ steps.hash.outputs.partition1 }}
      partition2: ${{ steps.hash.outputs.partition2 }}
      prefix: ${{ steps.hash.outputs.prefix }}
      binary: ${{ steps.hash.outputs.binary }}
    steps: &leg-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
      # GitHub promises only 14 GB free on a standard hosted runner. These preinstalled SDKs are
      # unused here; the system's compilers and Python, and rustup, stay.
      - name: Free disk space; print the commit, the runner image, SOURCE_DATE_EPOCH and df -h
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          echo "commit: $(git rev-parse HEAD)"
          echo "ImageOS: $ImageOS"
          echo "ImageVersion: $ImageVersion"
          echo "SOURCE_DATE_EPOCH: $(sed -n 's/^SOURCE_DATE_EPOCH = //p' pi/os/pins.txt)"
          df -h
      - name: KC_WORK, a fresh build directory outside the checkout
        run: |
          if [ -e "$KC_WORK" ]; then echo "FAIL: $KC_WORK exists on a fresh runner" >&2; exit 1; fi
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$KC_WORK"
          ls -ld "$KC_WORK"
      # The arm64 leg runs the linux/amd64 build container under emulation: the cross toolchain,
      # Bootlin's armv6-eabihf, runs on x86_64 hosts only (pi/os/pins.txt; tasks/todo.md, M7 C2,
      # the owner's answer of 2026-11-22, and M7-8). QEMU is Debian trixie's qemu-user (static, no
      # dependencies) from the build container's own snapshot, by SHA-256, and only its x86_64
      # handler is registered with binfmt_misc, by the deb's own line (flags OPF: F opens the
      # interpreter now, so it serves inside containers too). qemu-user leaves a 64-bit guest's
      # addresses uncapped, and arm64's default top-down layout hands out 48-bit ones that x86_64
      # Linux never does: rustc's jemalloc sign-extends them and segfaults (M7-9). The legacy
      # bottom-up layout starts near 2^46, below x86_64's 47 bits; this runner is discarded after.
      - name: x86_64 emulation (arm64 leg)
        if: env.LEG == 'arm64'
        run: |
          fail() { echo "FAIL: x86_64 emulation: $1" >&2; exit 1; }
          uname -a
          lscpu | sed -n 's/^\(Model name\|Vendor ID\|Flags\):/&/p'
          snap=$(sed -n "s/^ *'deb \[check-valid-until=no\] \(http:\/\/snapshot\.debian\.org\/archive\/debian\/[0-9TZ]*\) trixie main' \\\\\$/\1/p" pi/os/container/Dockerfile)
          [ "$(printf '%s\n' "$snap" | wc -l)" -eq 1 ] && [ -n "$snap" ] || fail "no one debian snapshot in pi/os/container/Dockerfile"
          deb=qemu-user_10.0.13+ds-0+deb13u1_arm64.deb
          dir=$RUNNER_TEMP/qemu
          mkdir "$dir"
          curl -fsSL --retry 5 -o "$dir/$deb" "$snap/pool/main/q/qemu/$deb"
          echo "c73711af02b97cd5e2667e735d9c06890c57165517110ca4e646c95a7083158d  $dir/$deb" | sha256sum -c - || fail "$deb has another SHA-256"
          [ ! -e /proc/sys/fs/binfmt_misc/qemu-x86_64 ] || fail "an x86_64 handler is already registered"
          sudo dpkg -i "$dir/$deb"
          conf=/usr/share/qemu/binfmt.d/qemu-x86_64.conf
          grep -q -x ':qemu-x86_64:M::.*:/usr/libexec/qemu-binfmt/x86_64-binfmt-P:OPF' "$conf" || fail "$conf is not the line reviewed"
          sudo sh -c "cat $conf > /proc/sys/fs/binfmt_misc/register"
          cat /proc/sys/fs/binfmt_misc/qemu-x86_64
          grep -q -x enabled /proc/sys/fs/binfmt_misc/qemu-x86_64 || fail "the x86_64 handler is not enabled"
          /usr/bin/qemu-x86_64 --version
          sudo sysctl -w vm.legacy_va_layout=1
          [ "$(cat /proc/sys/vm/legacy_va_layout)" = 1 ] || fail "vm.legacy_va_layout is not 1"
      # Emulation must check signatures as the native legs do: the pinned base image, run under
      # it with no network, verifies the snapshot's Release with its own sqv and keyring, as apt
      # does in the container build. A failure here prints sqv's own reason.
      - name: Emulation verifies the snapshot's signature (arm64 leg)
        if: env.LEG == 'arm64'
        run: |
          fail() { echo "FAIL: emulated signature check: $1" >&2; exit 1; }
          from=$(sed -n 's/^FROM \(debian@sha256:[0-9a-f]\{64\}\)$/\1/p' pi/os/container/Dockerfile)
          snap=$(sed -n "s/^ *'deb \[check-valid-until=no\] \(http:\/\/snapshot\.debian\.org\/archive\/debian\/[0-9TZ]*\) trixie main' \\\\\$/\1/p" pi/os/container/Dockerfile)
          [ -n "$from" ] && [ -n "$snap" ] || fail "no FROM digest or snapshot in pi/os/container/Dockerfile"
          rel=$RUNNER_TEMP/release
          mkdir "$rel"
          curl -fsSL --retry 5 -o "$rel/Release" "$snap/dists/trixie/Release"
          curl -fsSL --retry 5 -o "$rel/Release.gpg" "$snap/dists/trixie/Release.gpg"
          docker run --rm --platform linux/amd64 --network none -v "$rel:/rel:ro" "$from" \
            sh -c 'uname -m && sqv --version && sqv --keyring /usr/share/keyrings/debian-archive-keyring.pgp /rel/Release.gpg /rel/Release' \
            || fail "sqv under emulation did not verify $snap/dists/trixie/Release"
      # The pinned build host (tasks/todo.md, M7 C1; pi/os/container/Dockerfile): Debian trixie by
      # digest, its packages from snapshot.debian.org at one fixed time, rustup-init by SHA-256 and
      # rust-toolchain.toml's toolchain, with Buildroot's host packages. Every pi/os command below
      # runs in a fresh container of it (pi/os/container.sh); the step prints its package list.
      - name: The build container (pi/os/container.sh build)
        run: |
          docker --version
          time sh pi/os/container.sh build
      # Leg a only, by exact key (no restore-keys); on a miss the post step saves what leg a
      # downloaded. Buildroot uses a cached file only if it has the pinned hash.
      - name: Buildroot's downloads from the cache (leg a; leg b downloads afresh)
        if: env.LEG == 'a'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KC_WORK }}/dl
          key: ${{ runner.os }}-${{ runner.arch }}-pi-image-dl-${{ hashFiles('Entropy/pi/os/pins.txt', 'Entropy/pi/os/configs/keepcrypt_pizero_defconfig', 'Entropy/pi/os/patches/linux/linux.hash') }}
      - name: make source image (in the container)
        run: time sh pi/os/container.sh run make -C pi/os source image
      # The job's outputs, for the compare job and the scan, and the image's lists (banned-api-check.sh
      # --image-lists, with the build's host mcopy, mdir and unsquashfs), the reviewed copy of which
      # lives in pi/os/expected/ (commit 16). The image is the one keepcrypt-pi-*.img the build made
      # (keepcrypt-pi-0.1.0-st7789-240x240.img, Q101 and Q47; M4b adds one per screen type), the kernel config
      # the .config it was built with, and the binary's SHA-256 that of the keepcrypt-pi cargo built
      # in the package's build directory (as pi/os/Makefile's scan takes it; BR2_STRIP_EXCLUDE_FILES
      # keeps the installed copy byte-equal), checked here against --image-lists' hash of the
      # image's own /usr/bin/keepcrypt-pi. The scan's Binary rule then proves the packed binary is
      # the file cargo built; given the image's own hash it would compare that file with itself.
      - name: Hash and list
        id: hash
        run: |
          fail() { echo "FAIL: hash and list: $1" >&2; exit 1; }
          commit=$(git rev-parse HEAD)
          shopt -s nullglob
          imgs=("$KC_WORK"/out/images/keepcrypt-pi-*.img)
          [ "${#imgs[@]}" -eq 1 ] || fail "not exactly one keepcrypt-pi-*.img in $KC_WORK/out/images: ${imgs[*]}"
          configs=("$KC_WORK"/out/build/linux-*/.config)
          [ "${#configs[@]}" -eq 1 ] || fail "not exactly one kernel .config in $KC_WORK/out/build: ${configs[*]}"
          built=$KC_WORK/out/build/keepcrypt-pi-0.1.0/target/arm-unknown-linux-gnueabihf/release/keepcrypt-pi
          [ -f "$built" ] || fail "no $built, the keepcrypt-pi cargo built"
          img=${imgs[0]}
          size=$(wc -c < "$img")
          echo "$img: $((size)) bytes"
          sum=$(sha256sum "$img")
          image=${sum%% *}
          sum=$(sha256sum "$built")
          binary=${sum%% *}
          lists=$(sh pi/os/container.sh tools scripts/banned-api-check.sh --image-lists "$img" "${configs[0]}")
          printf '%s\n' "$lists"
          get() { printf '%s\n' "$lists" | sed -n "s/^sha256 $1 \([0-9a-f]\{64\}\)\$/\1/p"; }
          [ "$(get image)" = "$image" ] || fail "--image-lists hashed another image"
          p1=$(get partition-1)
          p2=$(get partition-2)
          packed=$(get keepcrypt-pi)
          [ -n "$packed" ] || fail "--image-lists printed no sha256 keepcrypt-pi line"
          echo "keepcrypt-pi SHA-256: built $binary, packed $packed"
          [ "$packed" = "$binary" ] || fail "the image's /usr/bin/keepcrypt-pi is not the keepcrypt-pi cargo built"
          prefix=$(sh pi/os/container.sh run python3 -I pi/os/rootfs-prefix.py "$img" "$KC_WORK/out/images/rootfs.squashfs")
          for v in "$p1" "$p2" "$binary" "$prefix"; do [ -n "$v" ] || fail "an empty hash or prefix"; done
          df -h
          {
            echo "commit=$commit"
            echo "name=${img##*/}"
            echo "path=$img"
            echo "image=$image"
            echo "partition1=$p1"
            echo "partition2=$p2"
            echo "prefix=$prefix"
            echo "binary=$binary"
          } | tee -a "$GITHUB_OUTPUT"
      # The image scan's own positive controls on this build (banned-api-check.sh --selftest-image;
      # tasks/todo.md, M4 group 14): the unchanged image must pass --image against the lists made
      # from it, and sixteen mutations of it (a planted marker, the test key, a shell, stripped,
      # RNG-importing and RNG-defining ELF files, a changed cmdline.txt, config.txt or kernel
      # config, a wrong binary hash) must each fail for the named rule. The ELF controls are built with the pinned
      # toolchain alone (rustc, rust-lld, llvm-objcopy), so no cross prefix is passed. The scan
      # against pi/os/expected/ (--image) follows.
      - name: Scan selftest (--selftest-image on this build)
        run: |
          shopt -s nullglob
          imgs=("$KC_WORK"/out/images/keepcrypt-pi-*.img)
          configs=("$KC_WORK"/out/build/linux-*/.config)
          [ "${#imgs[@]}" -eq 1 ] && [ "${#configs[@]}" -eq 1 ] || { echo "FAIL: not exactly one image and one .config" >&2; exit 1; }
          sh pi/os/container.sh tools scripts/banned-api-check.sh --selftest-image "${imgs[0]}" "${configs[0]}"
      # The image scan (banned-api-check.sh --image; tasks/todo.md, M4 group 14 steps 2-7; Q38 (d)):
      # this build's boot and root lists, keepcrypt-pi's imports and the kernel config must equal
      # the reviewed pi/os/expected/, the deny list, the board files and Q35's inittab must hold,
      # no marker or test key may appear in the image or any file, every other ELF file must keep
      # its dynamic symbols and import no RNG, and /usr/bin/keepcrypt-pi must pass the artifact
      # rules with no simulator name and the SHA-256 of the file cargo built (BIN_SHA256, the
      # binary output above). A hit fails the leg: the upload below is then skipped, and the
      # compare job still runs and fails on the leg's result.
      - name: Scan (--image against pi/os/expected)
        env:
          BINARY: ${{ steps.hash.outputs.binary }}
        run: |
          shopt -s nullglob
          imgs=("$KC_WORK"/out/images/keepcrypt-pi-*.img)
          configs=("$KC_WORK"/out/build/linux-*/.config)
          [ "${#imgs[@]}" -eq 1 ] && [ "${#configs[@]}" -eq 1 ] || { echo "FAIL: not exactly one image and one .config" >&2; exit 1; }
          sh pi/os/container.sh tools scripts/banned-api-check.sh --image "${imgs[0]}" pi/os/expected "${configs[0]}" "$BINARY"
      # Leg a only, after the scan passed: the release files every run makes, so a release tag's run
      # (Entropy/tasks/todo.md, M7 B3, Q110) is no different from any other. Buildroot's legal-info
      # (make -C pi/os legal-info, offline as make image is) gives manifest.csv, and scripts/sbom.py
      # pi-image the image's SBOM from it and from keepcrypt-pi's cargo metadata for its target, read
      # offline from the crates make source fetched. SHA256SUMS holds the image's, the SBOM's and the
      # manifest's SHA-256.
      - name: Release files (leg a; legal-info, the image's SBOM, SHA256SUMS)
        if: env.LEG == 'a'
        env:
          NAME: ${{ steps.hash.outputs.name }}
          IMAGE_PATH: ${{ steps.hash.outputs.path }}
        run: |
          time sh pi/os/container.sh run make -C pi/os legal-info
          rel=$KC_WORK/release
          mkdir "$rel"
          sh pi/os/container.sh run env CARGO_HOME=/kc-work/cargo cargo metadata --locked --offline --format-version 1 \
            --filter-platform arm-unknown-linux-gnueabihf > "$KC_WORK/metadata-arm.json"
          cp "$KC_WORK/out/legal-info/manifest.csv" "$rel/$NAME.legal-info-manifest.csv"
          sh pi/os/container.sh run python3 -I scripts/sbom.py pi-image --metadata "$KC_WORK/metadata-arm.json" --lock Cargo.lock \
            --manifest "$rel/$NAME.legal-info-manifest.csv" --out "$rel/$NAME.sbom.cdx.json"
          cp "$IMAGE_PATH" "$rel/"
          (cd "$rel" && sha256sum -- "$NAME" "$NAME.sbom.cdx.json" "$NAME.legal-info-manifest.csv" > SHA256SUMS)
          rm "$rel/$NAME"
          cat "$rel/SHA256SUMS"
      - name: Upload the release files (leg a)
        if: env.LEG == 'a'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-image-release-files
          path: ${{ env.KC_WORK }}/release/
          retention-days: 14
          if-no-files-found: error
      # Leg a only, and only after the scan above passed: a failed step ends the job, so an image
      # with a hit is never uploaded. Kept 14 days for the owner's hardware checks (H1-H4).
      - name: Upload the image (leg a; scanned)
        if: env.LEG == 'a'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.hash.outputs.path }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  build-b:
    name: pi-image build (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEG: b
    defaults: *leg-defaults
    outputs: *leg-outputs
    steps: *leg-steps

  build-arm64:
    # The third build, on an arm64 host, running the same linux/amd64 container under emulation
    # (tasks/todo.md, M7 C2 and lead decision M7-6): it must give leg a's image. GitHub's job limit,
    # six hours, is its timeout; its first runs measure how much of it emulation takes.
    name: pi-image build (arm64 host, emulated x86_64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      LEG: arm64
    defaults: *leg-defaults
    outputs: *leg-outputs
    steps: *leg-steps

  reproducible:
    # Runs when a leg failed too (its scan, say), so the run always says whether the two builds
    # agreed; not when the run was cancelled. Fails unless both image hashes are non-empty and
    # equal, both legs built the same commit and both legs succeeded (so both scans passed); then
    # the summary names the commit, the image and its SHA-256, the rootfs prefix and the binary's
    # SHA-256.
    name: pi-image reproducible (a = b = arm64)
    needs: [build-a, build-b, build-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both legs built the same commit into the same image
        env:
          RESULT_A: ${{ needs.build-a.result }}
          RESULT_B: ${{ needs.build-b.result }}
          COMMIT_A: ${{ needs.build-a.outputs.commit }}
          COMMIT_B: ${{ needs.build-b.outputs.commit }}
          NAME_A: ${{ needs.build-a.outputs.name }}
          NAME_B: ${{ needs.build-b.outputs.name }}
          IMAGE_A: ${{ needs.build-a.outputs.image }}
          IMAGE_B: ${{ needs.build-b.outputs.image }}
          PARTITION_1_A: ${{ needs.build-a.outputs.partition1 }}
          PARTITION_1_B: ${{ needs.build-b.outputs.partition1 }}
          PARTITION_2_A: ${{ needs.build-a.outputs.partition2 }}
          PARTITION_2_B: ${{ needs.build-b.outputs.partition2 }}
          PREFIX_A: ${{ needs.build-a.outputs.prefix }}
          PREFIX_B: ${{ needs.build-b.outputs.prefix }}
          BINARY_A: ${{ needs.build-a.outputs.binary }}
          BINARY_B: ${{ needs.build-b.outputs.binary }}
          RESULT_ARM64: ${{ needs.build-arm64.result }}
          COMMIT_ARM64: ${{ needs.build-arm64.outputs.commit }}
          NAME_ARM64: ${{ needs.build-arm64.outputs.name }}
          IMAGE_ARM64: ${{ needs.build-arm64.outputs.image }}
          PARTITION_1_ARM64: ${{ needs.build-arm64.outputs.partition1 }}
          PARTITION_2_ARM64: ${{ needs.build-arm64.outputs.partition2 }}
          PREFIX_ARM64: ${{ needs.build-arm64.outputs.prefix }}
          BINARY_ARM64: ${{ needs.build-arm64.outputs.binary }}
        run: |
          for v in RESULT COMMIT NAME IMAGE PARTITION_1 PARTITION_2 PREFIX BINARY; do
            a=${v}_A
            b=${v}_B
            c=${v}_ARM64
            echo "$v: a ${!a:-(none)}, b ${!b:-(none)}, arm64 ${!c:-(none)}"
          done
          fail() { echo "FAIL: pi-image reproducible: $1" >&2; exit 1; }
          [ -n "$IMAGE_A" ] && [ -n "$IMAGE_B" ] && [ -n "$IMAGE_ARM64" ] || fail "a leg gave no image hash"
          [ "$IMAGE_A" = "$IMAGE_B" ] || fail "legs a and b gave different images (the partition hashes above say which part)"
          [ "$IMAGE_A" = "$IMAGE_ARM64" ] || fail "the arm64 host gave another image than leg a (the partition hashes above say which part)"
          [ -n "$COMMIT_A" ] && [ "$COMMIT_A" = "$COMMIT_B" ] && [ "$COMMIT_A" = "$COMMIT_ARM64" ] || fail "the legs built different commits"
          [ "$RESULT_A" = success ] && [ "$RESULT_B" = success ] && [ "$RESULT_ARM64" = success ] || fail "a leg's result is not success (a: $RESULT_A, b: $RESULT_B, arm64: $RESULT_ARM64): a step after its build failed, its scan or leg a's upload, or the leg was cancelled; the image is not accepted"
          echo "all three legs built $COMMIT_A into $NAME_A, SHA-256 $IMAGE_A, and every scan passed"
          {
            echo "## Entropy Pi image"
            echo
            echo "- Commit: \`$COMMIT_A\`"
            echo "- Image: \`$NAME_A\`, leg a's artifact (kept 14 days)"
            echo "- Image SHA-256, the same in legs a and b and on the arm64 host: \`$IMAGE_A\`"
            echo "- Rootfs prefix: \`$PREFIX_A\`"
            echo "- keepcrypt-pi SHA-256, the build's (the file cargo built, which the image's /usr/bin/keepcrypt-pi equals): \`$BINARY_A\`"
            echo
            echo "**Scanned.** All three legs' scans of their image against the reviewed \`pi/os/expected/\` (\`banned-api-check.sh --image\`, with the kernel config and that binary hash) passed, as they must for the legs to succeed; each leg's \"Scan\" step holds the output."
          } >> "$GITHUB_STEP_SUMMARY"
