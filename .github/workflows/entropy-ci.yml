# KeepCrypt-Entropy CI: every Entropy/CLAUDE.md rule a machine can check runs on every PR and
# every push to main that touches Entropy/ or an Entropy workflow (.github/workflows/entropy-*;
# Entropy/docs/build-plan.md, "Security rules enforced in CI"). The project lives in Entropy/ of
# the keepcrypt monorepo: every run step starts there, and cache paths and hashFiles() name
# Entropy/ because they resolve from the repo root.
#
# No paths: filter (tasks/todo.md, M1 Q12): the workflow starts on every PR and every push to main,
# and its first job, changes, says whether Entropy/ or an Entropy workflow changed. Every other
# job needs it and is skipped otherwise, which GitHub counts as passing, so required checks never
# stay pending on a PR that does not touch Entropy/. (GitHub leaves a path-filtered workflow
# pending instead.) The cross matrix skips its steps rather than the job: a skipped matrix job
# reports one check under its unexpanded name, not one per target. A ruleset must require the
# changes job too: if it fails, the jobs that need it are skipped, and skipped counts as passing.
#
# Hardening: read-only token and no secret; only actions/checkout and actions/cache, pinned by
# commit SHA; no event data (github.event.*, head_ref) inside run scripts; tools built from
# crates.io with their own lockfiles; the toolchain comes from rust-toolchain.toml through the
# runner's preinstalled rustup.
#
# Caches: a cache written by a PR run is scoped to that PR's merge ref, so main and other PRs
# only ever restore caches written by runs on main. Keys are exact (no restore-keys). The
# advisory databases are never cached: cargo deny and cargo audit fetch them fresh every run.

name: Entropy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels its stale run. A running main build always finishes; a queued
  # one is replaced by a newer push to main (GitHub's default for a concurrency group).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash runs with -eo pipefail: any failing command fails the step.
    shell: bash
    working-directory: Entropy

env:
  CARGO_INCREMENTAL: 0
  # Tool versions, used by both the install command and the cache key.
  CARGO_DENY: cargo-deny@0.20.2
  CARGO_AUDIT: cargo-audit@0.22.2
  CARGO_VET: cargo-vet@0.10.2
  CARGO_LLVM_COV: cargo-llvm-cov@0.9.1

jobs:
  changes:
    # Q12: did this PR or push change Entropy/ or an Entropy workflow (entropy-*, so gates checks
    # the image workflow's hardening too, Q38 (d); the job keeps its required name)? A pull
    # request's checkout is its merge commit, whose first parent is the base branch; a push to main
    # compares with the commit main pointed to before. Event data reaches the script through env
    # only. A range that cannot be read (a new branch, a force push) counts as a change, so every
    # job runs. The answer is git diff's exit code over the two pathspecs (from the repo root, the
    # glob quoted for git), never a text match on a list of names: --no-renames reports a file
    # moved out of Entropy/ as the deletion it is (a rename lists only its new path), a pathspec
    # also matches the names git prints quoted (non-ASCII), and nothing pipes into an early-exiting
    # reader, which under -eo pipefail turned a long list into "false" (SIGPIPE). Names: log only.
    name: changes (Entropy/ or this workflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      entropy: ${{ steps.diff.outputs.entropy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # An assignment, so a failing rev-parse fails the step (cd "" would carry on in Entropy/).
          top=$(git rev-parse --show-toplevel)
          cd "$top"
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base=$BEFORE; fi
          rc=0
          git diff --quiet --no-renames "$base" HEAD -- Entropy/ '.github/workflows/entropy-*' 2>/dev/null || rc=$?
          case $rc in
            0) entropy=false ;;
            1) entropy=true ;;
            *) echo "cannot read the range $base..HEAD (git diff exit $rc); every job runs"; entropy=true ;;
          esac
          if [ "$rc" -le 1 ]; then
            # The first 50 changed paths, both sides of a move, unquoted. sed reads to the end, so
            # git never writes into a closed pipe.
            git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD | sed -n '1,50s/^/changed: /p'
          fi
          echo "entropy=$entropy" | tee -a "$GITHUB_OUTPUT"

  lint:
    # Definition of done: fmt and clippy clean. clippy.toml in core/, ffi/ and pi/app/ bans the
    # fallback and discard methods (rule 3); their shared [lints] forbid switching that off and
    # deny print and dbg (rule 5). Clippy runs twice: with default features, the release
    # configuration, and with all features, so the test-sources stubs and the test-registry code
    # (rule 10) meet the same lints. First, on the bare checkout, the grep gate's fault check
    # (tasks/todo.md, lead decision M5-66): each tool the gate's scan runs fails at every place
    # that runs it, unable to start, exiting 2 with nothing, and killed partway, and every such run
    # must stop the gate with exit 2, naming the tool, how it failed and what it read. It needs only
    # sh, bash, git and the gate's own tools, and runs here because the gates job has no time to
    # spare (688 s of its 720 at 6a6a34f, run 40455117393). When the canaries leave that job, they
    # go to another one than this (M5-67).
    name: lint (fmt, clippy)
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/banned-api-faults.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            Entropy/target/
          key: ${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    # Known answers and typestate tests (rules 6, 7, 12) as they land; locked dependencies. The
    # workspace run tests the release configuration (no test feature on: scripts/canaries.sh
    # refuses any manifest that turns one on, since cargo would merge it into every package); the
    # second run turns on test-sources, and with it test-registry, for the stub-source and
    # test-registry tests, which declare required-features (rule 10).
    # M3 (tasks/todo.md, Q31 (b)): the simulator's tests run again in the registry configuration,
    # test-registry switched on from the command line through -p (Q30 (b)), so the gate scenarios
    # pass in both. Then the test-registry simulator's release build for this runner's x86_64 Linux,
    # in its own target dir and with the cross job's getrandom cfg set for that target only (as
    # scripts/canaries.sh's build_probe does), goes through the artifact scan, which must exit 1
    # with exactly three hits: the registry marker, the simulator marker and the test key, so no
    # stub marker (rule 10). The scan also shows no foreign RNG crate symbol. It cannot see std's
    # OS-seeded hashing: the grep gate's hash ban covers that in the shipped crates' sources (core,
    # ffi and pi/app), and pi/sim's own code never ships.
    # M4 (tasks/todo.md, groups 8 and 12): the stick driver's loop-device test. The last steps make
    # a 16 MiB FAT32 image on a loop device and a mount point, name them and the test's own
    # mountinfo in the KC_* variables, build pi/app's binary tests as the runner's user, and run
    # device::usb::tests::loop_device alone as root, with only those variables preserved: the
    # driver's read-only mounts, create-new write, read-back and removal through the glue's own
    # mount(2) and umount2(2), on a filesystem that ignores letter case. The test fails if a
    # variable is missing and holds no path literal. The step fails unless exactly 1 passed (9d): a
    # renamed test, a wrong path or a build without it runs no test and exits 0. The loop device
    # is detached whatever happened.
    name: test
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            Entropy/target/
          key: ${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - run: cargo test --workspace --locked
      - run: cargo test -p keepcrypt-core --locked --features test-sources
      - run: cargo test -p keepcrypt-pi-sim --locked --features keepcrypt-core/test-registry
      # M5 (tasks/todo.md, group 12): the FFI's three crates alone, their features unified among
      # themselves as in the phone library's build, not across the workspace; then with
      # test-registry, so the tests that branch on registry_key_is_test() run their registry half.
      # keepcrypt-ffi depends on keepcrypt-core, so cargo takes the feature with these three
      # selected (on keepcrypt-jni alone it refuses it, lead decision M5-35), and no -p
      # keepcrypt-core is needed, which would add core's dev-dependencies and tests.
      - run: cargo test -p keepcrypt-ffi -p keepcrypt-guard -p keepcrypt-jni --locked
      - run: cargo test -p keepcrypt-ffi -p keepcrypt-guard -p keepcrypt-jni --locked --features keepcrypt-core/test-registry
      # --target keeps the cfg off build scripts: cargo applies a target's rustflags to host
      # artifacts only when no --target is given.
      - name: Build the test-registry simulator for release (x86_64 Linux, its own target dir)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '--cfg getrandom_backend="linux_getrandom"'
        run: cargo build --release --locked -p keepcrypt-pi-sim --bin keepcrypt-pi-sim --features keepcrypt-core/test-registry --target x86_64-unknown-linux-gnu --target-dir target/pi-sim-scan
      # The scan's llvm-nm is llvm-tools-preview's, which the toolchain step installs.
      - name: Scan the test-registry simulator (exactly its two markers and the test key)
        run: |
          sim=target/pi-sim-scan/x86_64-unknown-linux-gnu/release/keepcrypt-pi-sim
          size=$(wc -c < "$sim")
          echo "$sim: $((size)) bytes"
          rc=0
          out=$(scripts/banned-api-check.sh --artifact x86_64-unknown-linux-gnu "$sim" 2>&1) || rc=$?
          printf '%s\n' "$out"
          fail() { echo "FAIL: the test-registry simulator's scan: $1" >&2; exit 1; }
          [ "$rc" -eq 1 ] || fail "exit $rc, not 1"
          # Each hit is one line, so three distinct hit lines and the count of 3 are all of them.
          for want in "Marker: $sim: KC_TEST_REGISTRY_DO_NOT_SHIP" \
            "Marker: $sim: KC_SIMULATOR_DO_NOT_SHIP" \
            "TestKey: $sim: the test registry public key " \
            "banned-api-check --artifact x86_64-unknown-linux-gnu: 3 hit(s) in 1 file(s)"; do
            case $out in *"$want"*) ;; *) fail "no line holds \"$want\"" ;; esac
          done
          case $out in *KC_TEST_SOURCE_DO_NOT_SHIP*) fail "the stub marker" ;; esac
      # Ubuntu's dosfstools, for mkfs.vfat; the runner image does not promise it.
      - name: A 16 MiB FAT32 loop device and a mount point, the stick of the loop-device test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools
          img=$RUNNER_TEMP/stick.img
          mnt=$RUNNER_TEMP/usb
          truncate -s 16M "$img"
          mkfs.vfat -F 32 "$img"
          mkdir "$mnt"
          dev=$(sudo losetup --find --show "$img")
          ro=/sys/block/${dev#/dev/}/ro
          sudo losetup --list "$dev"
          echo "$ro: $(cat "$ro")"
          {
            echo "KC_LOOP_DEV=$dev"
            echo "KC_LOOP_RO=$ro"
            echo "KC_LOOP_MNT=$mnt"
            echo "KC_MOUNTINFO=/proc/self/mountinfo"
          } | tee -a "$GITHUB_ENV"
      # The test binary is the one executable cargo reports for the bin target; it is run by its
      # path, so sudo builds nothing.
      - name: Run the loop-device test as root (exactly 1 passed)
        run: |
          cargo test -p keepcrypt-pi --locked --bin keepcrypt-pi --no-run
          tests=$(cargo test -p keepcrypt-pi --locked --bin keepcrypt-pi --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable')
          echo "test binary: $tests"
          fail() { echo "FAIL: the loop-device test: $1" >&2; exit 1; }
          case $tests in
            */keepcrypt_pi-*) ;;
            *) fail "no keepcrypt_pi test binary in cargo's output: \"$tests\"" ;;
          esac
          [ "$(printf '%s\n' "$tests" | wc -l)" -eq 1 ] || fail "more than one test binary"
          rc=0
          out=$(sudo --preserve-env=KC_LOOP_DEV,KC_LOOP_RO,KC_LOOP_MNT,KC_MOUNTINFO "$tests" --ignored --exact device::usb::tests::loop_device 2>&1) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || fail "exit $rc"
          case $out in *"test device::usb::tests::loop_device ... ok"*) ;; *) fail "loop_device did not run" ;; esac
          case $out in *"test result: ok. 1 passed; 0 failed; 0 ignored;"*) ;; *) fail "not exactly 1 passed" ;; esac
      - name: Detach the loop device
        if: always()
        run: |
          [ -n "$KC_LOOP_DEV" ] || { echo "no loop device was set up"; exit 0; }
          if mountpoint -q "$KC_LOOP_MNT"; then sudo umount --lazy "$KC_LOOP_MNT"; fi
          sudo losetup --detach "$KC_LOOP_DEV"

  supply-chain:
    # Rules 1, 5 and 11: deny.toml bans the rand family, network and logging crates, allows
    # crates.io only and a fixed licence list, and fails on advisories; cargo audit prints
    # unmaintained crates as warnings; cargo vet needs an audit or exemption for every crate.
    # check-path-deps.sh fails any non-workspace crate not from crates.io, such as a [patch],
    # [replace] or .cargo path override, which deny's source check and vet let through.
    name: supply-chain (deny, audit, vet)
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: ~/.cargo-tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ env.CARGO_DENY }}-${{ env.CARGO_AUDIT }}-${{ env.CARGO_VET }}
      - name: Install cargo-deny, cargo-audit and cargo-vet
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root "$HOME/.cargo-tools" "$CARGO_DENY" "$CARGO_AUDIT" "$CARGO_VET"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-${{ runner.arch }}-supply-chain-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      - run: scripts/check-path-deps.sh
      - run: cargo deny --locked check
      - run: cargo audit
      - run: cargo vet --locked

  gates:
    # Rule 1 and the network and clipboard bans as a grep gate, plus its self-test (with the
    # release-artifact scan's fixtures, which rustc builds for an Android and an iOS target, and the
    # workflow fixtures); the workflow hardening check (tasks/todo.md, M4 group 11; Q38 (d)): every
    # entropy-*.yml in .github/workflows keeps the header's rules, a read-only token, the three
    # allowed actions pinned by SHA, no secret, no fork-trusting trigger and no expression inside a
    # run step; the image's text-only configuration check (M4 group 11, --os-config): pi/os's
    # inittab, fstab, cmdline.txt and config.txt, expected/linux.config against the fragment's
    # required and forbidden lists with one hwrng driver, and BusyBox's config with init and mount
    # alone; the APK check's self-test (M5 group 5, --selftest-apk; no Android SDK: stub tools and
    # stub APKs): its refusals, and the manifest, native-library, marker, dex-reference, alignment
    # and signer rules each firing exactly once on its case; the Android Rust library script's
    # self-test (M5 group 4, scripts/android-rust.sh --selftest; no NDK: stand-in tools, cargo and
    # scan): both flavours' builds and copies, and each of its checks failing on its case (an import
    # the API 31 stubs lack, a scan outcome, a copy with other bytes, a failing sha256sum); the
    # verifier self-test (13 checks:
    # every vectors/ file regenerated or recomputed,
    # Coldcard's hash-pinned scripts re-run behind rolls.json and on agreement.json's dice-only
    # subset, and lone copies of the shipped verify.py under an audit hook, piped and in a
    # pseudo-terminal); the
    # root filesystem prefix script's self-test (tasks/todo.md, M4 group 9): the vector's prefix
    # that pi/app's device/rootfs test pins, recomputed by the script that gives each image's, and
    # each of its refusals; the kernel allow-list script's self-test (M4 group 13): kconfig.sh on
    # a stub kernel tree, refusing a forbidden option selected back on, a required one dropped and
    # a module left; and
    # the canaries: crates that must fail cargo-deny and clippy, mutated copies of the real crates,
    # a path override, the dependency graph pins, a changed byte in each vectors file vectorgen.py
    # writes or reads back, a changed agreement.json value core's agreement test must refuse,
    # copies of verify.py that check 12 must fail, and the artifact scan's positive controls on
    # host release probes built with test-registry and test-sources (rule 10), each of which must
    # fail on every run, so a gate that stops firing turns CI red.
    name: gates (banned APIs, verifier, canaries)
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The grep gate runs first, on the bare checkout, before anything writes target/. The
      # workflows live at the repo root, so the hardening check is given ../.github/workflows.
      - run: scripts/banned-api-check.sh
      - run: scripts/banned-api-check.sh --workflows ../.github/workflows
      - run: scripts/banned-api-check.sh --os-config pi/os
      - run: scripts/banned-api-check.sh --selftest-apk
      - run: sh scripts/android-rust.sh --selftest
      - run: python3 -I tools/verify/vectorgen.py --selftest
      - run: python3 -I pi/os/rootfs-prefix.py --selftest
      - run: sh pi/os/kconfig.sh --selftest
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: ~/.cargo-tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ env.CARGO_DENY }}
      - name: Install cargo-deny
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root "$HOME/.cargo-tools" "$CARGO_DENY"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-${{ runner.arch }}-gates-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      # After the toolchain and the caches, the gate's self-test, as two shards, and the canaries run
      # side by side, each into its own log, which the step then prints. None reads another's output
      # (run one after the other, the self-test and the canaries took 614 s of the job's 12-minute
      # budget, run 39518485129). The self-test was the job's long pole and grows with every rule
      # (M5-63): whole, beside the canaries, this step took 555 s of the job's 649 at 1481 cases (run
      # 39783747232). Each shard runs every other case of the one list (banned-api-check.sh,
      # "Selftest shards"). On the owner's Mac at 1569 cases, the whole self-test took 541 s alone,
      # and this step's three 462 s side by side: the shards 349 s and 347 s, the canaries 462 s.
      # The step fails if any of the three fails, and unless each shard prints one count line, both
      # for the same whole list, and their own counts add up to it, so no case runs twice or is left
      # out. The self-test's artifact fixtures need rustc, the aarch64-linux-android,
      # aarch64-apple-ios and arm-unknown-linux-gnueabihf targets, and llvm-nm and llvm-ar from
      # llvm-tools-preview.
      - name: The gate's self-test and the canaries, side by side
        run: |
          scripts/banned-api-check.sh --selftest --shard 1/2 > "$RUNNER_TEMP/selftest-1.log" 2>&1 &
          shard1_pid=$!
          scripts/banned-api-check.sh --selftest --shard 2/2 > "$RUNNER_TEMP/selftest-2.log" 2>&1 &
          shard2_pid=$!
          canaries=0
          scripts/canaries.sh > "$RUNNER_TEMP/canaries.log" 2>&1 || canaries=$?
          shard1=0
          wait "$shard1_pid" || shard1=$?
          shard2=0
          wait "$shard2_pid" || shard2=$?
          echo "::group::scripts/banned-api-check.sh --selftest --shard 1/2 (exit $shard1)"
          cat "$RUNNER_TEMP/selftest-1.log"
          echo "::endgroup::"
          echo "::group::scripts/banned-api-check.sh --selftest --shard 2/2 (exit $shard2)"
          cat "$RUNNER_TEMP/selftest-2.log"
          echo "::endgroup::"
          echo "::group::scripts/canaries.sh (exit $canaries)"
          cat "$RUNNER_TEMP/canaries.log"
          echo "::endgroup::"
          tail -n 2 "$RUNNER_TEMP/selftest-1.log"
          tail -n 2 "$RUNNER_TEMP/selftest-2.log"
          tail -n 1 "$RUNNER_TEMP/canaries.log"
          # Shard K's one "selftest: shard K/2: OWN of WHOLE cases" line, in its own log.
          counts=0
          awk '
            FNR == 1 { f++ }
            $0 ~ "^selftest: shard " f "/2: [0-9]+ of [0-9]+ cases$" { n[f]++; own[f] = $4 + 0; whole[f] = $6 + 0 }
            END {
              if (f == 2 && n[1] == 1 && n[2] == 1 && whole[1] > 0 && whole[1] == whole[2] && own[1] + own[2] == whole[1]) {
                printf "the shards split one list: %d and %d of its %d cases\n", own[1], own[2], whole[1]
              } else {
                print "the shards do not split one list: each needs one count line, both for the same whole list, and their own counts must add up to it"
                exit 1
              }
            }' "$RUNNER_TEMP/selftest-1.log" "$RUNNER_TEMP/selftest-2.log" || counts=$?
          [ "$shard1" -eq 0 ] && [ "$shard2" -eq 0 ] && [ "$canaries" -eq 0 ] && [ "$counts" -eq 0 ]

  verifier-py39:
    # verify.py promises Python 3.9+, the stock /usr/bin/python3 an offline Mac user has; the
    # gates job runs Ubuntu's 3.12. Both run the same 13 checks, so check 12's lone copies and
    # check 13's byte-for-byte regeneration of agreement.json run on 3.9 too, and check 12's
    # Latin-1 locale run, which Linux runs only where that locale is installed, is required here.
    # Full path, because python3 on PATH is Homebrew's. If Apple ships another version this fails,
    # so the floor is re-decided, not silently untested.
    name: verifier (python 3.9)
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stock /usr/bin/python3 is 3.9
        run: |
          v=$(/usr/bin/python3 --version)
          echo "$v"
          case $v in
            "Python 3.9."*) ;;
            *) echo "FAIL: expected Python 3.9.x; re-decide the verifier's floor" >&2; exit 1 ;;
          esac
      - run: /usr/bin/python3 -I tools/verify/vectorgen.py --selftest

  coverage:
    # M1 gate (docs/build-plan.md): at least 95% line coverage in core/. The test-sources run, so
    # the stub and fault-injection tests count, with nothing excluded: no #[coverage(off)], no
    # cfg(coverage) (--no-cfg-coverage), and the first step fails if any core/src path matches the
    # path parts of the tool's default ignore rule (cargo-llvm-cov 0.9.1, src/report.rs: a tests/,
    # examples/ or benches/ directory, a rustc/<hex or x.y.z>/ directory anywhere in the path, or a
    # tests.rs, *_tests.rs or *-tests.rs file), which would leave that code out of the figure
    # unseen. The rule's other parts name the target dir and the cargo and rustup homes.
    name: coverage (core, 95% of lines)
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No core/src path the coverage tool would skip
        run: |
          files=$(find core/src -type f)
          [ -n "$files" ] || { echo "FAIL: no file under core/src" >&2; exit 1; }
          skipped=$(printf '%s\n' "$files" | grep -E '/(tests|examples|benches)/|/rustc/([0-9a-f]+|[0-9]+\.[0-9]+\.[0-9]+)/|/tests\.rs$|_tests\.rs$|-tests\.rs$' || true)
          if [ -n "$skipped" ]; then
            printf '%s\n' "$skipped"
            echo "FAIL: cargo-llvm-cov's default ignore rule would leave these core/src files out" >&2
            exit 1
          fi
          echo "no core/src path matches /(tests|examples|benches)/, /rustc/<hex or x.y.z>/, tests.rs, *_tests.rs or *-tests.rs"
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: ~/.cargo-tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ env.CARGO_LLVM_COV }}
      - name: Install cargo-llvm-cov
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root "$HOME/.cargo-tools" "$CARGO_LLVM_COV"
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            Entropy/target/
          key: ${{ runner.os }}-${{ runner.arch }}-coverage-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      - run: cargo llvm-cov --version
      - run: cargo llvm-cov --locked -p keepcrypt-core --features test-sources --no-cfg-coverage --fail-under-lines 95 --summary-only

  age-interop:
    # Rule 8 and Q1 (ii): the backup is a real age v1 file. Ubuntu's age, at the version Q1
    # approved, against core in both directions at work factor 18 (scripts/age-interop.py --core):
    # age encrypts each backup.json plaintext, armored and binary, and verify.py's reader and core's
    # decrypt_backup read it; vectorgen.py's writer and core write fresh backups and age decrypts them;
    # a wrong passphrase fails in age and in the reader, or the script fails. The script drives age
    # through a pseudo-terminal, since age reads a passphrase only from a terminal.
    name: age-interop (age 1.1.1)
    needs: changes
    if: needs.changes.outputs.entropy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ubuntu's age, version asserted
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
          v=$(dpkg-query -W -f='${Version}' age)
          echo "age package $v; age --version: $(age --version)"
          if [ "$v" != "1.1.1-1ubuntu0.24.04.3" ]; then
            echo "FAIL: expected age 1.1.1-1ubuntu0.24.04.3 (tasks/todo.md, M1 Q1); re-decide the pin" >&2
            exit 1
          fi
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            Entropy/target/
          key: ${{ runner.os }}-${{ runner.arch }}-age-interop-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      - run: python3 scripts/age-interop.py --core

  cross:
    # M0 gate: the core cross-compiles for the Pi Zero, Android and iOS. Clippy runs per target, so
    # target-only code in core and in the shell for that target (pi/app on the Pi, ffi on the
    # phones) meets the same lints as the host (rules 3 and 5). Then the release-artifact scan
    # (rules 1 and 10; tasks/todo.md, M1 group 11): core's release rlib and the release probe
    # (core/examples/release_probe.rs, every OS draw site and the registry-key path), both with
    # default features, linked per target, must hold no test marker, no test registry key and no
    # RNG symbol but the target's OS import, which must be there: getrandom on the Pi and Android,
    # CCRandomGenerateBytes on iOS (Q8). The Pi and Android legs build with getrandom's
    # linux_getrandom backend, which has no /dev/urandom fallback, through
    # CARGO_TARGET_<TARGET>_RUSTFLAGS: never a workflow-wide RUSTFLAGS, which would also reach the
    # host's build scripts. M3 (tasks/todo.md, Q31 (c)): the leg whose crates include keepcrypt-pi
    # also builds pi/app's release rlib, scanned with core's artifacts; it must be clean, and as an
    # archive it needs no OS import. M4 (tasks/todo.md, group 12): that leg also links the
    # keepcrypt-pi binary with the stand-in gcc below and scans it with the rest: it must import
    # getrandom, keep its symbol table, and hold no marker, test key, std random-key path or other
    # RNG symbol. The shipped binary comes from the image workflow's Buildroot toolchain; this one
    # is scanned, never run. M5 (tasks/todo.md, group 12; Q55): the three Android legs link with
    # NDK r30 (30.0.16248370, the NDK the app's build pins), never the image's default, and build
    # the phone library, keepcrypt-jni's libkeepcrypt.so, twice: the shipping one (default
    # features) joins the scan above, and must import getrandom and keep its symbol table; the
    # test-registry one, in its own target dir, must show exactly its registry marker and the
    # test key. Both must have 16 KB pages on arm64 and x86_64 and export exactly our two
    # symbols, JNI_OnLoad and Java_com_keepcrypt_entropy_ffi_Native_call (lead decision M5-21),
    # beside secp256k1-sys's own four. The iPhone's library is M6 (Q73). Every step checks the
    # changes job (see the header).
    name: cross (${{ matrix.target }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pi Zero v1.3: ARMv6 with hard float.
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04
            crates: keepcrypt-core keepcrypt-pi
          # Android, minSdk 31 (docs/mobile-apps.md), with NDK r30; the FFI's three crates, so
          # keepcrypt-jni's library is built and checked below.
          - target: aarch64-linux-android
            os: ubuntu-24.04
            ndk_clang: aarch64-linux-android31-clang
            crates: keepcrypt-core keepcrypt-ffi keepcrypt-guard keepcrypt-jni
          - target: armv7-linux-androideabi
            os: ubuntu-24.04
            ndk_clang: armv7a-linux-androideabi31-clang
            crates: keepcrypt-core keepcrypt-ffi keepcrypt-guard keepcrypt-jni
          - target: x86_64-linux-android
            os: ubuntu-24.04
            ndk_clang: x86_64-linux-android31-clang
            crates: keepcrypt-core keepcrypt-ffi keepcrypt-guard keepcrypt-jni
          # iPhone and its simulator, with the image's default Xcode.
          - target: aarch64-apple-ios
            os: macos-26
            crates: keepcrypt-core keepcrypt-ffi
          - target: aarch64-apple-ios-sim
            os: macos-26
            crates: keepcrypt-core keepcrypt-ffi
    env:
      TARGET: ${{ matrix.target }}
      # iOS 17+ (docs/mobile-apps.md); read by rustc and cc on the iOS targets only.
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.entropy == 'true'
        with:
          persist-credentials: false
      # No target/: cc reruns a build script only when an env var changes, so cached objects
      # would hide a compiler change. Every run compiles secp256k1-sys with the image's
      # current compiler (design.md principle 7, test the path, not the presence).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.entropy == 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-${{ runner.arch }}-cross-${{ matrix.target }}-${{ hashFiles('Entropy/rust-toolchain.toml', 'Entropy/Cargo.lock') }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.entropy == 'true'
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      # The C parts (secp256k1-sys) need a C compiler for each target, and the probe a linker.
      - name: C compiler and linker for the Pi Zero (Ubuntu's arm-linux-gnueabihf gcc)
        if: needs.changes.outputs.entropy == 'true' && matrix.target == 'arm-unknown-linux-gnueabihf'
        # A stand-in: the shipped binary comes from the image workflow's Buildroot ARMv6 toolchain
        # (tasks/todo.md, M4 group 12). The probe and the keepcrypt-pi binary built here link
        # against Ubuntu's armhf glibc; they are scanned, never run.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          arm-linux-gnueabihf-gcc --version
          {
            echo "CC_arm_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc"
            echo "AR_arm_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar"
            echo "CFLAGS_arm_unknown_linux_gnueabihf=-march=armv6zk -mfpu=vfp -mfloat-abi=hard -marm"
            echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
          } >> "$GITHUB_ENV"
      # M5 (tasks/todo.md, group 12; Q55): NDK r30 at its exact revision under the SDK root, the
      # NDK mobile/android's build pins (ndkVersion). The image's NDKs are listed for Review. If an
      # image update has dropped r30, sdkmanager installs that revision (the image's SDK licences
      # are accepted, Q54; a licence prompt gets no answer, so nothing is installed and the check
      # that follows fails). Its source.properties is printed and must name that revision: no
      # other NDK is ever used, the image's default (ANDROID_NDK_HOME) included. Its llvm-readelf
      # and llvm-nm check the phone library below.
      - name: C compiler and linker for Android (NDK r30 clang, API 31)
        if: needs.changes.outputs.entropy == 'true' && matrix.ndk_clang != ''
        env:
          NDK_CLANG: ${{ matrix.ndk_clang }}
          KC_NDK: 30.0.16248370
        run: |
          fail() { echo "FAIL: NDK $KC_NDK: $1" >&2; exit 1; }
          sdk=${ANDROID_SDK_ROOT:-}
          [ -n "$sdk" ] && [ -d "$sdk" ] || fail "no Android SDK (ANDROID_SDK_ROOT)"
          echo "ANDROID_SDK_ROOT: $sdk"
          echo "== the image's NDKs ($sdk/ndk)"
          if [ -d "$sdk/ndk" ]; then ls "$sdk/ndk"; else echo "none: no $sdk/ndk"; fi
          echo "ANDROID_NDK_HOME (the image's default NDK, not used): ${ANDROID_NDK_HOME:-}"
          ndk=$sdk/ndk/$KC_NDK
          if [ ! -e "$ndk" ]; then
            echo "NDK $KC_NDK is not on the image: sdkmanager --install \"ndk;$KC_NDK\""
            "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$KC_NDK" < /dev/null
          fi
          props=$ndk/source.properties
          [ -f "$props" ] || fail "no $props"
          cat "$props"
          grep -q "^Pkg[.]Revision = $KC_NDK\$" "$props" || fail "$props is not NDK $KC_NDK"
          bin=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          for tool in "$NDK_CLANG" llvm-ar llvm-nm llvm-readelf; do
            [ -x "$bin/$tool" ] || fail "no $tool in $bin"
          done
          "$bin/$NDK_CLANG" --version
          t=${TARGET//-/_}
          {
            echo "CC_$t=$bin/$NDK_CLANG"
            echo "AR_$t=$bin/llvm-ar"
            echo "CARGO_TARGET_${t^^}_LINKER=$bin/$NDK_CLANG"
            echo "KC_NDK_BIN=$bin"
          } >> "$GITHUB_ENV"
      # Q8: getrandom's default Linux and Android backend looks getrandom up with dlsym and falls
      # back to /dev/urandom; linux_getrandom calls libc's getrandom and nothing else, so the scan
      # can require that import. Every Linux runner leg builds a Pi or Android target.
      - name: getrandom without its /dev/urandom fallback (Pi and Android)
        if: needs.changes.outputs.entropy == 'true' && runner.os == 'Linux'
        run: |
          t=${TARGET//-/_}
          echo "CARGO_TARGET_${t^^}_RUSTFLAGS=--cfg getrandom_backend=\"linux_getrandom\"" | tee -a "$GITHUB_ENV"
      - name: Xcode
        if: needs.changes.outputs.entropy == 'true' && runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      # Each crate's clippy.toml and [lints] apply, as in the lint job.
      - name: Clippy for the target
        if: needs.changes.outputs.entropy == 'true'
        env:
          CRATES: ${{ matrix.crates }}
        run: |
          pkgs=()
          for c in $CRATES; do pkgs+=(-p "$c"); done
          cargo clippy --locked "${pkgs[@]}" --all-targets --target "$TARGET" -- -D warnings
      - name: Build the release rlib and the release probe (default features)
        if: needs.changes.outputs.entropy == 'true'
        run: cargo build --release --locked -p keepcrypt-core --lib --example release_probe --target "$TARGET"
      # M3, M4: the scan step scans this rlib and the binary on the same condition (keepcrypt-pi
      # among the crates).
      - name: Build pi/app's release rlib (default features)
        if: needs.changes.outputs.entropy == 'true' && contains(format(' {0} ', matrix.crates), ' keepcrypt-pi ')
        run: cargo build --release --locked -p keepcrypt-pi --lib --target "$TARGET"
      - name: Build pi/app's release binary (default features)
        if: needs.changes.outputs.entropy == 'true' && contains(format(' {0} ', matrix.crates), ' keepcrypt-pi ')
        run: cargo build --release --locked -p keepcrypt-pi --bin keepcrypt-pi --target "$TARGET"
      # M5 (tasks/todo.md, group 12): the phone library, keepcrypt-jni's cdylib libkeepcrypt.so, as
      # the shipping APK carries it (default features); the scan step scans it on the same
      # condition (keepcrypt-jni among the crates).
      - name: Build libkeepcrypt.so (release, default features)
        if: needs.changes.outputs.entropy == 'true' && contains(format(' {0} ', matrix.crates), ' keepcrypt-jni ')
        run: cargo build --release --locked -p keepcrypt-jni --lib --target "$TARGET"
      # The test-registry APK's library: test-registry switched on from the command line with -p,
      # never in a manifest. keepcrypt-jni has no keepcrypt-core edge (lead decision M5-35), so
      # cargo refuses the feature on -p keepcrypt-jni alone; -p keepcrypt-core names it, and the
      # build's one keepcrypt-core, which keepcrypt-jni reaches through keepcrypt-guard and
      # keepcrypt-ffi, has it. Its own target dir, so no shipping build file is reused.
      - name: Build the test-registry libkeepcrypt.so (its own target dir)
        if: needs.changes.outputs.entropy == 'true' && contains(format(' {0} ', matrix.crates), ' keepcrypt-jni ')
        run: cargo build --release --locked -p keepcrypt-jni -p keepcrypt-core --lib --features keepcrypt-core/test-registry --target "$TARGET" --target-dir target/ffi-test-registry
      - name: Scan the release artifacts (markers, test key, RNG symbols, the OS import)
        if: needs.changes.outputs.entropy == 'true'
        env:
          CRATES: ${{ matrix.crates }}
        run: |
          rlib="target/$TARGET/release/libkeepcrypt_core.rlib"
          probe="target/$TARGET/release/examples/release_probe"
          pi="target/$TARGET/release/keepcrypt-pi"
          so="target/$TARGET/release/libkeepcrypt.so"
          files=("$rlib" "$probe")
          case " $CRATES " in
            *" keepcrypt-pi "*) files+=("target/$TARGET/release/libkeepcrypt_pi.rlib" "$pi") ;;
          esac
          case " $CRATES " in
            *" keepcrypt-jni "*) files+=("$so") ;;
          esac
          for f in "${files[@]}"; do
            size=$(wc -c < "$f")
            echo "$f: $((size)) bytes"
          done
          # The binary's OS import as llvm-nm prints it, for Review (tasks/todo.md, M4 group 12),
          # and the phone library's (M5 group 12); the scan requires it (OSImport) and refuses a
          # stripped file (Format).
          case " $CRATES " in
            *" keepcrypt-pi "*) "$(rustc --print target-libdir)/../bin/llvm-nm" -u "$pi" | grep -E '(^| )getrandom(@|$)' ;;
          esac
          case " $CRATES " in
            *" keepcrypt-jni "*) "$(rustc --print target-libdir)/../bin/llvm-nm" -u "$so" | grep -E '(^| )getrandom(@|$)' ;;
          esac
          scripts/banned-api-check.sh --artifact "$TARGET" "${files[@]}"
      # The test-registry library (M5 group 12; rule 10), as the test job scans the test-registry
      # simulator: the scan must exit 1 with exactly two hits, its registry marker and the test
      # key, so no stub marker, no RNG symbol, no stripped file and the OS import there.
      - name: Scan the test-registry libkeepcrypt.so (exactly its registry marker and the test key)
        if: needs.changes.outputs.entropy == 'true' && contains(format(' {0} ', matrix.crates), ' keepcrypt-jni ')
        run: |
          so="target/ffi-test-registry/$TARGET/release/libkeepcrypt.so"
          size=$(wc -c < "$so")
          echo "$so: $((size)) bytes"
          rc=0
          out=$(scripts/banned-api-check.sh --artifact "$TARGET" "$so" 2>&1) || rc=$?
          printf '%s\n' "$out"
          fail() { echo "FAIL: the test-registry libkeepcrypt.so's scan: $1" >&2; exit 1; }
          [ "$rc" -eq 1 ] || fail "exit $rc, not 1"
          # Each hit is one line, so two distinct hit lines and the count of 2 are all of them.
          for want in "Marker: $so: KC_TEST_REGISTRY_DO_NOT_SHIP" \
            "TestKey: $so: the test registry public key " \
            "banned-api-check --artifact $TARGET: 2 hit(s) in 1 file(s)"; do
            case $out in *"$want"*) ;; *) fail "no line holds \"$want\"" ;; esac
          done
          case $out in *KC_TEST_SOURCE_DO_NOT_SHIP*) fail "the stub marker" ;; esac
      # Both libraries, read with NDK r30's tools (M5 group 12). 16 KB pages, which Play requires of
      # every 64-bit library from 2027-02-01 (NDK r28 on links them so): llvm-readelf -lW must show
      # an alignment of 0x4000 on every LOAD segment on arm64 and x86_64. armeabi-v7a keeps 4 KB
      # pages, which Play allows, so its segments are printed, not judged. The exports (lead
      # decision M5-21): llvm-nm -D's defined symbols are printed, and ours among them must be
      # exactly JNI_OnLoad and Java_com_keepcrypt_entropy_ffi_Native_call. The only others allowed
      # are secp256k1-sys's own #[no_mangle] functions (0.10.1: its context allocator pair and its
      # two default callbacks), which a cdylib exports with ours; any other defined symbol fails.
      - name: libkeepcrypt.so's LOAD alignment and exports (both builds)
        if: needs.changes.outputs.entropy == 'true' && contains(format(' {0} ', matrix.crates), ' keepcrypt-jni ')
        run: |
          fail() { echo "FAIL: $1" >&2; exit 1; }
          case $TARGET in
            aarch64-linux-android | x86_64-linux-android) page=0x4000 ;;
            armv7-linux-androideabi) page= ;;
            *) fail "no page-size rule for $TARGET" ;;
          esac
          ours='JNI_OnLoad Java_com_keepcrypt_entropy_ffi_Native_call'
          secp='rustsecp256k1_v0_10_0_context_create rustsecp256k1_v0_10_0_context_destroy'
          secp="$secp rustsecp256k1_v0_10_0_default_error_callback_fn rustsecp256k1_v0_10_0_default_illegal_callback_fn"
          want=$(printf '%s\n' $ours | LC_ALL=C sort)
          for so in "target/$TARGET/release/libkeepcrypt.so" "target/ffi-test-registry/$TARGET/release/libkeepcrypt.so"; do
            echo "== $so: llvm-readelf -lW, the LOAD segments"
            loads=$("$KC_NDK_BIN/llvm-readelf" -lW "$so" | awk '$1 == "LOAD"')
            [ -n "$loads" ] || fail "$so: no LOAD segment"
            printf '%s\n' "$loads"
            if [ -n "$page" ]; then
              # The alignment is a LOAD line's last field (the flags before it may hold spaces).
              bad=$(printf '%s\n' "$loads" | awk -v page="$page" '$NF != page')
              [ -z "$bad" ] || fail "$so: a LOAD segment is not aligned to $page (16 KB pages)"
              echo "every LOAD segment aligned to $page"
            else
              echo "armeabi-v7a: 4 KB pages, printed, not judged"
            fi
            echo "== $so: llvm-nm -D --defined-only"
            "$KC_NDK_BIN/llvm-nm" -D --defined-only "$so" > "$RUNNER_TEMP/exports"
            cat "$RUNNER_TEMP/exports"
            # The name is each line's last field, without a version suffix.
            got=$(awk -v secp="$secp" '
              BEGIN { n = split(secp, s, " "); for (i = 1; i <= n; i++) theirs[s[i]] = 1 }
              { name = $NF; sub(/@.*/, "", name); if (!(name in theirs)) print name }' "$RUNNER_TEMP/exports" | LC_ALL=C sort -u)
            [ "$got" = "$want" ] || fail "$so: our defined symbols are not exactly JNI_OnLoad and Java_com_keepcrypt_entropy_ffi_Native_call: $(printf '%s ' $got)"
            echo "our exports: exactly $(printf '%s ' $want)(secp256k1-sys's: $(grep -c -E ' rustsecp256k1_v0_10_0_' "$RUNNER_TEMP/exports" || :) of its four)"
          done
